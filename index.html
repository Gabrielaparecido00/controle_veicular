<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Veículos</title>

<style>

/* =====================================
RESET
===================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6fa;
color:#222;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* =====================================
HEADER
===================================== */

header{
background:#0b1f3a;
color:white;
padding:12px 20px;
display:flex;
align-items:center;
justify-content:space-between;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

header img{
height:40px;
}

header .user{
font-size:14px;
}

header button{
background:#ff4b4b;
border:none;
color:white;
padding:8px 14px;
border-radius:6px;
cursor:pointer;
}

/* =====================================
LOGIN
===================================== */

#loginScreen{
flex:1;
display:flex;
align-items:center;
justify-content:center;
}

.loginCard{
width:350px;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 4px 20px rgba(0,0,0,.2);
}

.loginCard h2{
margin-bottom:20px;
}

.loginCard input{
width:100%;
padding:10px;
margin-bottom:12px;
border:1px solid #ccc;
border-radius:6px;
}

.loginCard button{
width:100%;
padding:10px;
background:#0b5cff;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

/* =====================================
APP
===================================== */

#app{
display:none;
flex:1;
flex-direction:column;
}

.container{
padding:20px;
max-width:1200px;
margin:auto;
}

/* =====================================
BUTTON MENU
===================================== */

.menu{
display:flex;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.menu button{
padding:12px 18px;
border:none;
background:#0b5cff;
color:white;
border-radius:6px;
cursor:pointer;
}

/* =====================================
PANEL
===================================== */

.panel{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 15px rgba(0,0,0,.15);
}

/* =====================================
FORM
===================================== */

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.form-grid input,
.form-grid select,
textarea{
padding:10px;
border:1px solid #ccc;
border-radius:6px;
width:100%;
}

textarea{
grid-column:span 2;
}

/* =====================================
PHOTO GRID
===================================== */

.photo-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:15px;
}

.photo-grid input{
border:1px dashed #aaa;
padding:8px;
}

/* =====================================
BUTTONS
===================================== */

.actions{
margin-top:15px;
display:flex;
gap:10px;
}

.actions button{
padding:10px 16px;
border:none;
border-radius:6px;
cursor:pointer;
}

.save{background:#00a86b;color:white;}
.cancel{background:#ccc;}
.edit{background:#ffaa00;color:white;}

/* =====================================
TABLE
===================================== */

table{
width:100%;
margin-top:15px;
border-collapse:collapse;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
text-align:left;
}

th{
background:#eee;
}

</style>
</head>

<body>

<header id="topBar" style="display:none">
<img src="vigorito.png">

<div class="user">
Olá, <span id="userName"></span>
</div>

<button onclick="logout()">Sair</button>
</header>

<!-- LOGIN -->

<div id="loginScreen">
<div class="loginCard">

<h2>Login</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Senha">

<button onclick="login()">Entrar</button>

</div>
</div>

<!-- APP -->

<div id="app">

<div class="container">

<div class="menu">

<button onclick="showPanel('entrada')">Entrada de veículo</button>
<button onclick="showPanel('saida')">Saída de veículo</button>
<button onclick="showPanel('condutor')">Cadastro condutor</button>
<button onclick="showPanel('autorizador')">Cadastro autorizador</button>
<button onclick="showPanel('consulta')">Consulta</button>

</div>

<div id="panel" class="panel">

Selecione uma ação.

</div>

</div>
</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore,collection,addDoc,getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage,ref,uploadBytes,getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {

};

/* init */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* LOGIN */

window.login = async function(){

console.log("Tentando login")

let email=document.getElementById("email").value
let password=document.getElementById("password").value

try{

await signInWithEmailAndPassword(auth,email,password)

}catch(e){

alert("Erro login")

console.error(e)

}

}

/* SESSION */

onAuthStateChanged(auth,(user)=>{

if(user){

console.log("Usuário logado",user.uid)

document.getElementById("loginScreen").style.display="none"

document.getElementById("app").style.display="flex"

document.getElementById("topBar").style.display="flex"

document.getElementById("userName").innerText=user.email

}else{

document.getElementById("loginScreen").style.display="flex"

document.getElementById("app").style.display="none"

document.getElementById("topBar").style.display="none"

}

})

/* LOGOUT */

window.logout=()=>{

signOut(auth)

}

/* PANELS */

window.showPanel=(type)=>{

let html=""

if(type=="entrada"){

html=`
<h3>Entrada de veículo</h3>

<div class="form-grid">

<input id="placa" placeholder="Placa">

<input id="veiculo" placeholder="Veículo">

<select id="condutor"></select>

<select id="autorizador"></select>

<select id="dano">
<option value="nao">Sem dano</option>
<option value="sim">Com dano</option>
</select>

<textarea placeholder="Observação"></textarea>

</div>

<h4>Fotos do veículo</h4>

<div class="photo-grid">

<input type="file" id="f1">
<input type="file" id="f2">
<input type="file" id="f3">
<input type="file" id="f4">
<input type="file" id="f5">
<input type="file" id="f6">
<input type="file" id="f7">
<input type="file" id="f8">

</div>

<div class="actions">

<button class="save" onclick="salvarEntrada()">Salvar</button>
<button class="cancel">Cancelar</button>

</div>

`

}

if(type=="saida"){

html=`
<h3>Saída de veículo</h3>

<div class="form-grid">

<input placeholder="Placa">

<input placeholder="Veículo">

<select></select>

<select></select>

<select>
<option>Sem dano</option>
<option>Com dano</option>
</select>

<textarea></textarea>

</div>

<h4>Fotos</h4>

<div class="photo-grid">

<input type="file">
<input type="file">
<input type="file">
<input type="file">
<input type="file">
<input type="file">
<input type="file">
<input type="file">

</div>

<div class="actions">

<button class="save">Salvar</button>
<button class="cancel">Cancelar</button>

</div>

`

}

if(type=="condutor"){

html=`

<h3>Novo condutor</h3>

<div class="form-grid">

<input id="nomeCondutor" placeholder="Nome completo">

<input id="cpfCondutor" placeholder="CPF">

<input id="cargoCondutor" placeholder="Cargo">

</div>

<div class="actions">

<button class="save" onclick="salvarCondutor()">Salvar</button>

</div>

`

}

if(type=="autorizador"){

html=`

<h3>Novo autorizador</h3>

<div class="form-grid">

<input id="nomeAut" placeholder="Nome completo">

<input id="cpfAut" placeholder="CPF">

<input id="cargoAut" placeholder="Cargo">

</div>

<div class="actions">

<button class="save" onclick="salvarAutorizador()">Salvar</button>

</div>

`

}

if(type=="consulta"){

html=`

<h3>Consulta</h3>

<input id="buscaPlaca" placeholder="Buscar placa">

<button onclick="buscar()">Pesquisar</button>

<table>

<thead>
<tr>
<th>Data</th>
<th>Tipo</th>
<th>Placa</th>
<th>Veículo</th>
<th>Condutor</th>
</tr>
</thead>

<tbody id="resultado">

</tbody>

</table>

`

}

document.getElementById("panel").innerHTML=html

}

/* CADASTROS */

window.salvarCondutor=async()=>{

let nome=document.getElementById("nomeCondutor").value
let cpf=document.getElementById("cpfCondutor").value
let cargo=document.getElementById("cargoCondutor").value

await addDoc(collection(db,"drivers"),{

nome,
cpf,
cargo

})

alert("Condutor cadastrado")

}

/* AUTORIZADOR */

window.salvarAutorizador=async()=>{

let nome=document.getElementById("nomeAut").value
let cpf=document.getElementById("cpfAut").value
let cargo=document.getElementById("cargoAut").value

await addDoc(collection(db,"authorizers"),{

nome,
cpf,
cargo

})

alert("Autorizador cadastrado")

}

/* ENTRADA */

window.salvarEntrada=async()=>{

let placa=document.getElementById("placa").value
let veiculo=document.getElementById("veiculo").value

await addDoc(collection(db,"movements"),{

tipo:"entrada",
placa,
veiculo,
data:new Date()

})

alert("Entrada registrada")

}

/* CONSULTA */

window.buscar=async()=>{

let placa=document.getElementById("buscaPlaca").value

let q=await getDocs(collection(db,"movements"))

let tbody=document.getElementById("resultado")

tbody.innerHTML=""

q.forEach(doc=>{

let d=doc.data()

if(!placa || d.placa.includes(placa)){

tbody.innerHTML+=`

<tr>

<td>${new Date(d.data.seconds*1000).toLocaleString()}</td>
<td>${d.tipo}</td>
<td>${d.placa}</td>
<td>${d.veiculo}</td>
<td>-</td>

</tr>

`

}

})

}

</script>

</body>
</html>
