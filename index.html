<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Controle Veicular</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#eef2f7;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#64748b;
      --primary:#2563eb;
      --primary-dark:#1d4ed8;
      --success:#10b981;
      --danger:#ef4444;
      --border:#dbe2ea;
      --header:#0f172a;
      --shadow:0 12px 30px rgba(15, 23, 42, .08);
      --radius:14px;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
      font-family:"Inter", sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    header{
      height:70px;
      background:var(--header);
      color:#fff;
      display:none;
      align-items:center;
      justify-content:space-between;
      padding:0 24px;
      box-shadow:0 4px 18px rgba(0,0,0,.18);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:700;
      font-size:18px;
    }

    .brand img{
      height:38px;
      width:auto;
      object-fit:contain;
    }

    .topbar-right{
      display:flex;
      align-items:center;
      gap:12px;
      font-size:14px;
    }

    .logout-btn{
      border:none;
      background:#1e293b;
      color:#fff;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
    }

    .logout-btn:hover{
      background:#334155;
    }

    #login{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .login-card{
      width:100%;
      max-width:390px;
      background:var(--card);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:32px;
    }

    .login-card h1{
      font-size:24px;
      margin-bottom:8px;
    }

    .login-card p{
      color:var(--muted);
      margin-bottom:22px;
      font-size:14px;
    }

    main{
      display:none;
      max-width:1280px;
      margin:0 auto;
      padding:24px;
    }

    .dashboard{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:14px;
      margin-bottom:18px;
    }

    .stat{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px;
      border:1px solid #edf2f7;
    }

    .stat small{
      color:var(--muted);
      display:block;
      margin-bottom:8px;
    }

    .stat strong{
      font-size:28px;
      font-weight:700;
    }

    .menu{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:18px;
    }

    .menu button{
      border:none;
      background:var(--primary);
      color:#fff;
      padding:12px 16px;
      border-radius:12px;
      cursor:pointer;
      font-weight:600;
    }

    .menu button:hover{
      background:var(--primary-dark);
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:24px;
      border:1px solid #edf2f7;
    }

    .card h2{
      font-size:22px;
      margin-bottom:6px;
    }

    .card .subtitle{
      color:var(--muted);
      margin-bottom:20px;
      font-size:14px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:14px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .field.full{
      grid-column:1 / -1;
    }

    label{
      font-size:13px;
      color:#334155;
      font-weight:600;
    }

    input, select, textarea{
      width:100%;
      border:1px solid var(--border);
      border-radius:10px;
      padding:12px 14px;
      font:inherit;
      background:#fff;
      color:var(--text);
      outline:none;
      transition:.18s ease;
    }

    textarea{
      resize:vertical;
      min-height:90px;
    }

    input:focus, select:focus, textarea:focus{
      border-color:#93c5fd;
      box-shadow:0 0 0 4px rgba(37,99,235,.10);
    }

    .actions{
      display:flex;
      gap:10px;
      margin-top:18px;
      flex-wrap:wrap;
    }

    .btn{
      border:none;
      border-radius:10px;
      padding:12px 18px;
      font-weight:700;
      cursor:pointer;
    }

    .btn-primary{
      background:var(--primary);
      color:#fff;
    }

    .btn-primary:hover{
      background:var(--primary-dark);
    }

    .btn-success{
      background:var(--success);
      color:#fff;
    }

    .btn-success:hover{
      filter:brightness(.95);
    }

    .btn-light{
      background:#e2e8f0;
      color:#0f172a;
    }

    .btn-danger{
      background:var(--danger);
      color:#fff;
    }

    .notice{
      margin-top:14px;
      padding:12px 14px;
      border-radius:10px;
      font-size:14px;
      display:none;
    }

    .notice.show{ display:block; }
    .notice.error{ background:#fee2e2; color:#991b1b; }
    .notice.success{ background:#dcfce7; color:#166534; }

    .table-wrap{
      overflow:auto;
      margin-top:18px;
      border:1px solid #e5e7eb;
      border-radius:12px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:760px;
      background:#fff;
    }

    th, td{
      padding:12px 14px;
      border-bottom:1px solid #eef2f7;
      text-align:left;
      font-size:14px;
      vertical-align:top;
    }

    th{
      background:#f8fafc;
      color:#334155;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .empty{
      color:var(--muted);
      padding:14px 2px 0;
      font-size:14px;
    }

    @media (max-width: 820px){
      .form-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>

  <header id="topbar">

  <main id="app">
    <section class="dashboard">

      </div>
      <div class="stat">

      <button id="btnSaida">Saída de veículo</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCp9SBiDUD5YaCGm8Qzbb7uv3Goa-7eKU0",
      authDomain: "controle-ponto-26d34.firebaseapp.com",
      projectId: "controle-ponto-26d34",
      storageBucket: "controle-ponto-26d34.firebasestorage.app",
      messagingSenderId: "730360923157",
      appId: "1:730360923157:web:cdd6ea1eeed6fd717d3a1c"
    };

    const appFirebase = initializeApp(firebaseConfig);
    const auth = getAuth(appFirebase);
    const db = getFirestore(appFirebase);

    const el = {
      topbar: document.getElementById("topbar"),

    function showNotice(target, message, type = "error") {
      target.className = `notice show ${type}`;
      target.textContent = message;
    }

    function clearNotice(target) {
      target.className = "notice";
      target.textContent = "";
    }

    function onlyDigits(value) {
      return value.replace(/\D/g, "");
    }

    function formatCPF(value) {
      const digits = onlyDigits(value).slice(0, 11);
      return digits
        .replace(/^(\d{3})(\d)/, "$1.$2")
        .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
        .replace(/\.(\d{3})(\d)/, ".$1-$2");
    }

    function isValidCPF(cpf) {
      const clean = onlyDigits(cpf);
      if (clean.length !== 11) return false;
      if (/^(\d)\1{10}$/.test(clean)) return false;

      let sum = 0;
      for (let i = 0; i < 9; i++) sum += Number(clean[i]) * (10 - i);
      let first = (sum * 10) % 11;
      if (first === 10) first = 0;
      if (first !== Number(clean[9])) return false;

      sum = 0;
      for (let i = 0; i < 10; i++) sum += Number(clean[i]) * (11 - i);
      let second = (sum * 10) % 11;
      if (second === 10) second = 0;
      if (second !== Number(clean[10])) return false;

      return true;
    }

    function formatPlate(value) {
      let clean = value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 7);
      if (clean.length > 3) {
        clean = clean.slice(0, 3) + "-" + clean.slice(3);
      }
      return clean;
    }

    function isValidPlate(plate) {
      const clean = plate.toUpperCase().replace(/[^A-Z0-9]/g, "");
      const oldPattern = /^[A-Z]{3}[0-9]{4}$/;
      const mercosulPattern = /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/;
      return oldPattern.test(clean) || mercosulPattern.test(clean);
    }

    function formatDate(value) {
      try {
        if (!value) return "-";
        if (value.seconds) {
          return new Date(value.seconds * 1000).toLocaleString("pt-BR");
        }
        return new Date(value).toLocaleString("pt-BR");
      } catch {
        return "-";
      }
    }

    async function login() {
      clearNotice(el.loginNotice);
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      if (!email || !senha) {
        showNotice(el.loginNotice, "Preencha e-mail e senha.");
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, senha);
      } catch (error) {
        showNotice(el.loginNotice, "Erro no login. Verifique e-mail e senha.");
        console.error(error);
      }
    }

    async function logout() {
      try {
        await signOut(auth);
      } catch (error) {
        alert("Erro ao sair.");
        console.error(error);
      }
    }

    async function carregarCondutoresSelect(selectId = "condutor") {
      const select = document.getElementById(selectId);
      if (!select) return;

      select.innerHTML = `<option value="">Selecione o condutor</option>`;

      const snap = await getDocs(query(collection(db, "condutores"), orderBy("nome")));
      snap.forEach((doc) => {
        const d = doc.data();
        const option = document.createElement("option");
        option.value = d.nome;
        option.textContent = d.nome;
        select.appendChild(option);
      });
    }

    async function carregarAutorizadoresSelect(selectId = "autorizador") {
      const select = document.getElementById(selectId);
      if (!select) return;

      select.innerHTML = `<option value="">Selecione o autorizador</option>`;

      const snap = await getDocs(query(collection(db, "autorizadores"), orderBy("nome")));
      snap.forEach((doc) => {
        const d = doc.data();
        const option = document.createElement("option");
        option.value = d.nome;
        option.textContent = d.nome;
        select.appendChild(option);
      });
    }

    function renderEntrada() {
      el.painel.innerHTML = `
        <h2>Entrada de veículo</h2>
        <p class="subtitle">Registre a entrada do veículo no pátio.</p>

        <div class="form-grid">
          <div class="field">

          <div class="field">

        <div class="actions">

          <button class="btn btn-light" id="limparEntrada">Limpar</button>
        </div>

        <div id="entradaNotice" class="notice"></div>

      const placa = document.getElementById("placa");

    function renderSaida() {
      el.painel.innerHTML = `
        <h2>Saída de veículo</h2>
        <p class="subtitle">Registre a saída do veículo do pátio.</p>

        <div class="form-grid">
          <div class="field">
            <label for="placaSaida">Placa</label>
            <input id="placaSaida" maxlength="8" placeholder="ABC-1234">
          </div>

          <div class="field">
            <label for="veiculoSaida">Veículo</label>
            <input id="veiculoSaida" maxlength="60" placeholder="Ex.: Onix branco">

          <div class="field full">

        </div>

        <div class="actions">
          <button class="btn btn-danger" id="salvarSaida">Salvar saída</button>
          <button class="btn btn-light" id="limparSaida">Limpar</button>
        </div>

        <div id="saidaNotice" class="notice"></div>
      `;

      const placa = document.getElementById("placaSaida");
      placa.addEventListener("input", () => {
        placa.value = formatPlate(placa.value);
      });

      carregarCondutoresSelect("condutorSaida");
      carregarAutorizadoresSelect("autorizadorSaida");
    }

    function renderCondutor() {
      el.painel.innerHTML = `
        <h2>Cadastro de condutor</h2>
        <p class="subtitle">Cadastre um novo condutor.</p>

        <div class="form-grid">
          <div class="field">
            <label for="nomeCondutor">Nome completo</label>

    async function renderConsulta() {
      el.painel.innerHTML = `
        <h2>Consulta</h2>
        <p class="subtitle">Consulte o histórico de movimentações por placa.</p>

        <div class="form-grid">
          <div class="field">
            <label for="buscaPlaca">Placa</label>
            <input id="buscaPlaca" maxlength="8" placeholder="Digite a placa">
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Data</th>
                <th>Tipo</th>
                <th>Placa</th>
                <th>Veículo</th>
                <th>Condutor</th>

      `;

      const busca = document.getElementById("buscaPlaca");
      busca.addEventListener("input", async () => {
        busca.value = formatPlate(busca.value);
        await carregarHistorico(busca.value);
      });

      await carregarHistorico();

    async function salvarCondutor() {
      const nome = document.getElementById("nomeCondutor").value.trim();
      const cpf = document.getElementById("cpfCondutor").value.trim();
      const cargo = document.getElementById("cargoCondutor").value.trim();
      const notice = document.getElementById("condutorNotice");

      clearNotice(notice);

      if (!nome || !cpf || !cargo) {
        showNotice(notice, "Preencha todos os campos.");
        return;
      }

      if (!isValidCPF(cpf)) {
        showNotice(notice, "CPF inválido.");
        return;
      }

      try {
        await addDoc(collection(db, "condutores"), {
          nome,
          cpf: onlyDigits(cpf),
          cargo,
          criadoEm: new Date()
        });

        showNotice(notice, "Condutor cadastrado com sucesso.", "success");
        await atualizarDashboard();
      } catch (error) {
        showNotice(notice, "Erro ao salvar condutor.");
        console.error(error);
      }
    }

    async function salvarAutorizador() {
      const nome = document.getElementById("nomeAut").value.trim();
      const cpf = document.getElementById("cpfAut").value.trim();
      const cargo = document.getElementById("cargoAut").value.trim();
      const notice = document.getElementById("autNotice");

      clearNotice(notice);

      if (!nome || !cpf || !cargo) {
        showNotice(notice, "Preencha todos os campos.");
        return;
      }

      if (!isValidCPF(cpf)) {
        showNotice(notice, "CPF inválido.");
        return;
      }

      try {
        await addDoc(collection(db, "autorizadores"), {
          nome,
          cpf: onlyDigits(cpf),
          cargo,
          criadoEm: new Date()
        });

        showNotice(notice, "Autorizador cadastrado com sucesso.", "success");
        await atualizarDashboard();
      } catch (error) {
        showNotice(notice, "Erro ao salvar autorizador.");
        console.error(error);
      }
    }

    async function salvarEntrada() {
      const placa = document.getElementById("placa").value.trim();
      const veiculo = document.getElementById("veiculo").value.trim();
      const condutor = document.getElementById("condutor").value;
      const autorizador = document.getElementById("autorizador").value;
      const dano = document.getElementById("dano").value;
      const observacao = document.getElementById("obsEntrada").value.trim();
      const notice = document.getElementById("entradaNotice");

      clearNotice(notice);

      if (!placa || !veiculo || !condutor || !autorizador) {
        showNotice(notice, "Preencha os campos obrigatórios.");
        return;
      }

      if (!isValidPlate(placa)) {
        showNotice(notice, "Placa inválida.");
        return;
      }

      try {
        await addDoc(collection(db, "movimentos"), {
          tipo: "entrada",
          placa: formatPlate(placa),
          veiculo,
          condutor,
          autorizador,
          dano,
          observacao,
          data: new Date()
        });

        showNotice(notice, "Entrada registrada com sucesso.", "success");
        await atualizarDashboard();
      } catch (error) {
        showNotice(notice, "Erro ao salvar entrada.");
        console.error(error);
      }
    }

    async function salvarSaida() {
      const placa = document.getElementById("placaSaida").value.trim();
      const veiculo = document.getElementById("veiculoSaida").value.trim();
      const condutor = document.getElementById("condutorSaida").value;
      const autorizador = document.getElementById("autorizadorSaida").value;
      const observacao = document.getElementById("obsSaida").value.trim();
      const notice = document.getElementById("saidaNotice");

      clearNotice(notice);

      if (!placa || !veiculo || !condutor || !autorizador) {
        showNotice(notice, "Preencha os campos obrigatórios.");
        return;
      }

      if (!isValidPlate(placa)) {
        showNotice(notice, "Placa inválida.");
        return;
      }

      try {
        await addDoc(collection(db, "movimentos"), {
          tipo: "saida",
          placa: formatPlate(placa),
          veiculo,
          condutor,
          autorizador,
          dano: "",
          observacao,
          data: new Date()
        });

        showNotice(notice, "Saída registrada com sucesso.", "success");
        await atualizarDashboard();
      } catch (error) {
        showNotice(notice, "Erro ao salvar saída.");
        console.error(error);
      }
    }

    async function carregarHistorico(filtroPlaca = "") {
      const tbody = document.getElementById("tbodyConsulta");
      const empty = document.getElementById("consultaEmpty");
      if (!tbody || !empty) return;

      tbody.innerHTML = "";
      empty.textContent = "";

      const snap = await getDocs(query(collection(db, "movimentos"), orderBy("data", "desc")));
      const filtro = filtroPlaca.toUpperCase().trim();

      let encontrados = 0;

      snap.forEach((doc) => {
        const d = doc.data();

        if (filtro && !String(d.placa || "").toUpperCase().includes(filtro)) {
          return;
        }

        encontrados++;
        tbody.innerHTML += `
          <tr>
            <td>${formatDate(d.data)}</td>
            <td>${d.tipo || "-"}</td>
            <td>${d.placa || "-"}</td>
            <td>${d.veiculo || "-"}</td>
            <td>${d.condutor || "-"}</td>
            <td>${d.autorizador || "-"}</td>
            <td>${d.dano || "-"}</td>
            <td>${d.observacao || "-"}</td>
          </tr>
        `;
      });

      if (encontrados === 0) {
        empty.textContent = "Nenhum registro encontrado.";
      }
    }

    async function atualizarDashboard() {
      try {
        const movSnap = await getDocs(query(collection(db, "movimentos"), orderBy("data")));
        const condSnap = await getDocs(collection(db, "condutores"));
        const autSnap = await getDocs(collection(db, "autorizadores"));

        const patio = {};

        movSnap.forEach((doc) => {
          const d = doc.data();
          const placa = d.placa;
          if (!placa) return;

          if (d.tipo === "entrada") patio[placa] = true;
          if (d.tipo === "saida") delete patio[placa];
        });

        el.statPatio.textContent = Object.keys(patio).length;
        el.statMovimentos.textContent = movSnap.size;
        el.statCondutores.textContent = condSnap.size;
        el.statAutorizadores.textContent = autSnap.size;
      } catch (error) {
        console.error("Erro ao atualizar dashboard:", error);
      }
    }

    document.getElementById("btnLogin").addEventListener("click", login);
    document.getElementById("btnLogout").addEventListener("click", logout);

    document.getElementById("btnEntrada").addEventListener("click", renderEntrada);
    document.getElementById("btnSaida").addEventListener("click", renderSaida);
    document.getElementById("btnCondutor").addEventListener("click", renderCondutor);
    document.getElementById("btnAutorizador").addEventListener("click", renderAutorizador);
    document.getElementById("btnConsulta").addEventListener("click", renderConsulta);

    document.addEventListener("click", async (e) => {
      if (e.target.id === "salvarCondutor") await salvarCondutor();
      if (e.target.id === "salvarAut") await salvarAutorizador();
      if (e.target.id === "salvarEntrada") await salvarEntrada();
      if (e.target.id === "salvarSaida") await salvarSaida();

      if (e.target.id === "limparCondutor") renderCondutor();
      if (e.target.id === "limparAut") renderAutorizador();
      if (e.target.id === "limparEntrada") renderEntrada();
      if (e.target.id === "limparSaida") renderSaida();
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        el.login.style.display = "none";
        el.topbar.style.display = "flex";
        el.app.style.display = "block";
        el.username.textContent = user.email || "Usuário";
        await atualizarDashboard();
      } else {
        el.login.style.display = "flex";
        el.topbar.style.display = "none";
        el.app.style.display = "none";
        el.username.textContent = "";
      }
    });
  </script>
</body>
</html>
