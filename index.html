<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Portaria Veículos</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>

<style>

body{
font-family: Arial;
background:#f4f6f9;
margin:0;
}

header{
background:#111827;
color:white;
padding:20px;
}

.dashboard{
display:flex;
gap:20px;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

button{
background:#2563eb;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
}

.modal-content{
background:white;
width:400px;
margin:100px auto;
padding:20px;
border-radius:10px;
}

input,select,textarea{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:10px;
}

</style>
</head>

<body>

<header>
<h2>Sistema de Portaria Veicular</h2>
</header>

<div class="dashboard">

<div class="card">
<h3>Entradas</h3>
<p id="entradas">0</p>
</div>

<div class="card">
<h3>Saídas</h3>
<p id="saidas">0</p>
</div>

<div class="card">
<button onclick="abrirEntrada()">Registrar Entrada</button>
</div>

<div class="card">
<button onclick="abrirSaida()">Registrar Saída</button>
</div>

</div>


<div class="modal" id="modalEntrada">

<div class="modal-content">

<h3>Entrada de Veículo</h3>

<label>Placa</label>
<input id="placa">

<label>Condutor</label>
<input id="condutor">

<label>Danos</label>
<textarea id="danos"></textarea>

<label>Foto</label>
<input type="file" accept="image/*" capture="camera">

<button onclick="salvarEntrada()">Salvar</button>

</div>
</div>


<script>

function abrirEntrada(){
document.getElementById("modalEntrada").style.display="block"
}

function abrirSaida(){
alert("Abrir formulário de saída")
}

function salvarEntrada(){

const placa = document.getElementById("placa").value
const condutor = document.getElementById("condutor").value
const danos = document.getElementById("danos").value

console.log({
placa,
condutor,
danos,
data:new Date()
})

alert("Entrada registrada")

}

</script>

</body>
</html>
