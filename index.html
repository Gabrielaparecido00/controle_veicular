<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle Veicular</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#eef2f7;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#dbe4ee;
      --primary:#2563eb;
      --primary-dark:#1d4ed8;
      --success:#10b981;
      --warning:#f59e0b;
      --danger:#ef4444;
      --header:#0f172a;
      --soft:#f8fafc;
      --shadow:0 16px 40px rgba(15,23,42,.08);
      --radius:16px;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    button,input,select,textarea{
      font:inherit;
    }

    .hidden{
      display:none !important;
    }

    /* TOPBAR */
    header{
      height:72px;
      background:var(--header);
      color:#fff;
      display:none;
      align-items:center;
      justify-content:space-between;
      padding:0 22px;
      box-shadow:0 8px 24px rgba(0,0,0,.18);
      position:sticky;
      top:0;
      z-index:100;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    /* LOGO VIGORITO */
    .brand-logo{
      width:42px;
      height:42px;
      border-radius:12px;
      object-fit:contain;
      background:rgba(255,255,255,.06);
      padding:6px;
      border:1px solid rgba(255,255,255,.10);
      flex-shrink:0;
    }

    .brand-text{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }

    .brand-text strong{
      font-size:16px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .brand-text span{
      font-size:12px;
      color:#cbd5e1;
    }

    .topbar-right{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .chip{
      background:rgba(255,255,255,.08);
      color:#fff;
      padding:8px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
    }

    .btn-topbar{
      border:none;
      background:#1e293b;
      color:#fff;
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      font-weight:700;
    }

    .btn-topbar:hover{
      background:#334155;
    }

    /* LOGIN */
    #loginView{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .login-wrap{
      width:100%;
      max-width:420px;
      background:var(--card);
      border-radius:22px;
      padding:32px;
      box-shadow:var(--shadow);
      border:1px solid #edf2f7;
    }

    .login-wrap h1{
      font-size:28px;
      margin-bottom:8px;
    }

    .login-wrap p{
      font-size:14px;
      color:var(--muted);
      margin-bottom:22px;
      line-height:1.5;
    }

    .form-group{
      display:flex;
      flex-direction:column;
      gap:7px;
      margin-bottom:14px;
    }

    .form-group label{
      font-size:13px;
      font-weight:700;
      color:#334155;
    }

    .input,
    .select,
    .textarea{
      width:100%;
      padding:12px 14px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      color:var(--text);
      outline:none;
      transition:.18s;
    }

    .textarea{
      resize:vertical;
      min-height:100px;
    }

    .input:focus,
    .select:focus,
    .textarea:focus{
      border-color:#93c5fd;
      box-shadow:0 0 0 4px rgba(37,99,235,.10);
    }

    .btn{
      border:none;
      border-radius:12px;
      padding:12px 16px;
      font-weight:800;
      cursor:pointer;
      transition:.18s;
    }

    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .btn-primary{
      background:var(--primary);
      color:#fff;
    }

    .btn-primary:hover{
      background:var(--primary-dark);
    }

    .btn-success{
      background:var(--success);
      color:#fff;
    }

    .btn-success:hover{
      filter:brightness(.97);
    }

    .btn-warning{
      background:var(--warning);
      color:#fff;
    }

    .btn-warning:hover{
      filter:brightness(.97);
    }

    .btn-danger{
      background:var(--danger);
      color:#fff;
    }

    .btn-danger:hover{
      filter:brightness(.97);
    }

    .btn-light{
      background:#e2e8f0;
      color:#0f172a;
    }

    .btn-light:hover{
      background:#cfd8e3;
    }

    .btn-block{
      width:100%;
    }

    .notice{
      display:none;
      margin-top:14px;
      padding:12px 14px;
      border-radius:12px;
      font-size:14px;
      line-height:1.4;
    }

    .notice.show{
      display:block;
    }

    .notice.error{
      background:#fee2e2;
      color:#991b1b;
    }

    .notice.success{
      background:#dcfce7;
      color:#166534;
    }

    .notice.info{
      background:#dbeafe;
      color:#1e40af;
    }

    /* APP */
    #appView{
      display:none;
      max-width:1420px;
      margin:0 auto;
      padding:24px;
    }

    .hero{
      margin-bottom:18px;
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:flex-start;
      flex-wrap:wrap;
    }

    .hero h2{
      font-size:28px;
      margin-bottom:8px;
    }

    .hero p{
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .hero-right{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .pill{
      background:#fff;
      border:1px solid #e5edf5;
      padding:10px 14px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      color:#334155;
      box-shadow:var(--shadow);
    }

    .dashboard{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:14px;
      margin-bottom:18px;
    }

    .stat{
      background:var(--card);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
      border:1px solid #edf2f7;
    }

    .stat small{
      display:block;
      color:var(--muted);
      margin-bottom:8px;
      font-size:13px;
      font-weight:600;
    }

    .stat strong{
      display:block;
      font-size:30px;
      line-height:1;
      margin-bottom:8px;
      font-weight:800;
    }

    .stat span{
      color:#475569;
      font-size:13px;
    }

    .menu{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:18px;
    }

    .menu .btn{
      border-radius:14px;
      padding:12px 16px;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:24px;
      border:1px solid #edf2f7;
    }

    .card-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    .card-header h3{
      font-size:24px;
      margin-bottom:6px;
    }

    .card-header p{
      color:var(--muted);
      font-size:14px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .full{
      grid-column:1 / -1;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:18px;
    }

    .table-wrap{
      overflow:auto;
      border:1px solid #e5edf5;
      border-radius:14px;
      background:#fff;
      margin-top:18px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:1100px;
    }

    th,td{
      padding:12px 14px;
      border-bottom:1px solid #eef2f7;
      text-align:left;
      vertical-align:top;
      font-size:14px;
    }

    th{
      background:#f8fafc;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.05em;
      color:#475569;
      font-weight:800;
    }

    .empty{
      margin-top:14px;
      color:var(--muted);
      font-size:14px;
    }

    .section-title{
      margin:20px 0 10px;
      font-size:16px;
      font-weight:800;
      color:#1e293b;
    }

    .store-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:14px;
      margin-top:10px;
    }

    .store-card{
      border:1px solid #e5edf5;
      border-radius:14px;
      padding:16px;
      background:#fff;
    }

    .store-card h4{
      font-size:16px;
      margin-bottom:8px;
    }

    .store-card .meta{
      color:#475569;
      font-size:13px;
      line-height:1.6;
    }

    .store-card .meta strong{
      color:#0f172a;
    }

    .row-badges{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
    }

    .badge-blue{
      background:#dbeafe;
      color:#1d4ed8;
    }

    .badge-green{
      background:#dcfce7;
      color:#166534;
    }

    .badge-amber{
      background:#fef3c7;
      color:#92400e;
    }

    .badge-red{
      background:#fee2e2;
      color:#991b1b;
    }

    /* FOTOS DO VEÍCULO */
    .photo-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:12px;
      margin-top:8px;
    }

    .photo-card{
      border:1px solid #e5edf5;
      border-radius:14px;
      padding:12px;
      background:#fff;
    }

    .photo-card strong{
      display:block;
      font-size:13px;
      margin-bottom:8px;
      color:#0f172a;
    }

    .photo-preview{
      width:100%;
      height:160px;
      border-radius:12px;
      background:#f1f5f9;
      border:1px dashed #cbd5e1;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      margin-bottom:10px;
      position:relative;
    }

    .photo-preview img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .photo-hint{
      font-size:12px;
      color:#64748b;
      text-align:center;
      padding:10px;
      line-height:1.35;
    }

    .file-input{
      width:100%;
    }

    @media (max-width:900px){
      .grid{
        grid-template-columns:1fr;
      }

      .hero h2{
        font-size:24px;
      }

      header{
        height:auto;
        padding:14px;
        align-items:flex-start;
      }
    }
  </style>
</head>
<body>

  <header id="topbar">
    <div class="brand">
      <img class="brand-logo" src="vigorito.png" alt="Vigorito">
      <div class="brand-text">
        <strong>Controle Veicular</strong>
        <span id="headerStoreText">Carregando unidade...</span>
      </div>
    </div>

    <div class="topbar-right">
      <div class="chip" id="headerRoleText">Perfil</div>
      <div class="chip" id="headerUserText">Usuário</div>
      <button class="btn-topbar" id="btnLogout">Sair</button>
    </div>
  </header>

  <section id="loginView">
    <div class="login-wrap">
      <h1>Acesso ao sistema</h1>
      <p>Entre com seu e-mail e senha para acessar sua unidade e suas permissões.</p>

      <div class="form-group">
        <label for="loginEmail">E-mail</label>
        <input class="input" id="loginEmail" type="email" placeholder="seuemail@empresa.com">
      </div>

      <div class="form-group">
        <label for="loginSenha">Senha</label>
        <input class="input" id="loginSenha" type="password" placeholder="Digite sua senha">
      </div>

      <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>

      <div id="loginNotice" class="notice"></div>
    </div>
  </section>

  <main id="appView">
    <section class="hero">
      <div>
        <h2 id="heroTitle">Painel</h2>
        <p id="heroSubtitle">Carregando informações...</p>
      </div>

      <div class="hero-right">
        <div class="pill" id="heroUser"></div>
        <div class="pill" id="heroRole"></div>
        <div class="pill" id="heroStore"></div>
      </div>
    </section>

    <section class="dashboard" id="dashboardCards"></section>

    <nav class="menu" id="menuBar"></nav>

    <section class="card" id="mainPanel">
      <div class="card-header">
        <div>
          <h3>Bem-vindo</h3>
          <p>Selecione uma função no menu acima.</p>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      getDocs,
      addDoc
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCp9SBiDUD5YaCGm8Qzbb7uv3Goa-7eKU0",
      authDomain: "controle-ponto-26d34.firebaseapp.com",
      projectId: "controle-ponto-26d34",
      storageBucket: "controle-ponto-26d34.appspot.com",
      messagingSenderId: "730360923157",
      appId: "1:730360923157:web:cdd6ea1eeed6fd717d3a1c"
    };

    const appFirebase = initializeApp(firebaseConfig);
    const auth = getAuth(appFirebase);
    const db = getFirestore(appFirebase);

    const el = {
      topbar: document.getElementById("topbar"),
      loginView: document.getElementById("loginView"),
      appView: document.getElementById("appView"),

      loginEmail: document.getElementById("loginEmail"),
      loginSenha: document.getElementById("loginSenha"),
      btnLogin: document.getElementById("btnLogin"),
      btnLogout: document.getElementById("btnLogout"),
      loginNotice: document.getElementById("loginNotice"),

      headerStoreText: document.getElementById("headerStoreText"),
      headerRoleText: document.getElementById("headerRoleText"),
      headerUserText: document.getElementById("headerUserText"),

      heroTitle: document.getElementById("heroTitle"),
      heroSubtitle: document.getElementById("heroSubtitle"),
      heroUser: document.getElementById("heroUser"),
      heroRole: document.getElementById("heroRole"),
      heroStore: document.getElementById("heroStore"),

      dashboardCards: document.getElementById("dashboardCards"),
      menuBar: document.getElementById("menuBar"),
      mainPanel: document.getElementById("mainPanel")
    };

    const state = {
      authUser: null,
      userProfile: null,
      lojas: [],
      lojasMap: {},
      movimentos: [],
      condutores: [],
      autorizadores: []
    };

    const Roles = {
      CONTROLADOR: "controlador",
      GERENTE_LOJA: "gerente_loja",
      GERENTE_GERAL: "gerente_geral"
    };

    const MOTIVOS_ENTRADA = [
      "Retorno test-drive",
      "Retorno de atividade externa",
      "Retorno de transferência",
      "Entrada para higienização",
      "Entrada para manutenção",
      "Entrada para peritagem / vistoria",
      "Entrada de veículo 0km",
      "Entrada de veículo seminovo",
      "Chegada de transporte / cegonha",
      "Devolução de cliente",
      "Entrada para exposição",
      "Entrada por recolhimento",
      "Outro"
    ];

    const MOTIVOS_SAIDA = [
      "Saída test-drive",
      "Transferência de loja",
      "Atividade externa",
      "Saída para manutenção",
      "Saída para higienização",
      "Saída para abastecimento",
      "Saída para vistoria / laudo",
      "Saída para emplacamento",
      "Saída para entrega ao cliente",
      "Saída para despachante",
      "Saída para logística / transporte",
      "Saída para pátio externo",
      "Saída por recolhimento",
      "Outro"
    ];

    function debugLog(...args){
      console.log(...args);
    }

    function debugError(...args){
      console.error(...args);
    }

    function clearNotice(target){
      target.className = "notice";
      target.textContent = "";
    }

    function showNotice(target, message, type = "error"){
      target.className = `notice show ${type}`;
      target.textContent = message;
    }

    function onlyDigits(value){
      return String(value || "").replace(/\D/g, "");
    }

    function formatCPF(value){
      const digits = onlyDigits(value).slice(0, 11);
      return digits
        .replace(/^(\d{3})(\d)/, "$1.$2")
        .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
        .replace(/\.(\d{3})(\d)/, ".$1-$2");
    }

    function isValidCPF(cpf){
      const clean = onlyDigits(cpf);
      if (clean.length !== 11) return false;
      if (/^(\d)\1{10}$/.test(clean)) return false;

      let sum = 0;
      for (let i = 0; i < 9; i++) sum += Number(clean[i]) * (10 - i);
      let first = (sum * 10) % 11;
      if (first === 10) first = 0;
      if (first !== Number(clean[9])) return false;

      sum = 0;
      for (let i = 0; i < 10; i++) sum += Number(clean[i]) * (11 - i);
      let second = (sum * 10) % 11;
      if (second === 10) second = 0;
      if (second !== Number(clean[10])) return false;

      return true;
    }

    function normalizePlate(value){
      return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    }

    function isValidPlate(plate){
      const clean = normalizePlate(plate);
      const oldPattern = /^[A-Z]{3}[0-9]{4}$/;
      const mercosulPattern = /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/;
      return oldPattern.test(clean) || mercosulPattern.test(clean);
    }

    function formatPlate(value){
      const clean = normalizePlate(value).slice(0, 7);
      if(!clean) return "";
      if(clean.length <= 3) return clean;
      return clean.slice(0, 3) + "-" + clean.slice(3);
    }

    function formatDate(value){
      try{
        if(!value) return "-";
        if(value.seconds) return new Date(value.seconds * 1000).toLocaleString("pt-BR");
        return new Date(value).toLocaleString("pt-BR");
      }catch(e){
        debugError("Erro ao formatar data:", e);
        return "-";
      }
    }

    function getRoleLabel(role){
      if(role === Roles.CONTROLADOR) return "Controlador de acesso";
      if(role === Roles.GERENTE_LOJA) return "Gerente de loja";
      if(role === Roles.GERENTE_GERAL) return "Gerente geral";
      return "Perfil não definido";
    }

    function getStoreName(lojaId){
      if(!lojaId) return "Todas as lojas";
      return state.lojasMap[lojaId]?.nome || lojaId;
    }

    function userCanCreateAutorizador(){
      return state.userProfile?.role === Roles.GERENTE_LOJA || state.userProfile?.role === Roles.GERENTE_GERAL;
    }

    function userIsGeneralManager(){
      return state.userProfile?.role === Roles.GERENTE_GERAL;
    }

    function userIsStoreManager(){
      return state.userProfile?.role === Roles.GERENTE_LOJA;
    }

    function userIsController(){
      return state.userProfile?.role === Roles.CONTROLADOR;
    }

    function currentUserStoreId(){
      return state.userProfile?.lojaId || null;
    }

    function filteredMovementsForUser(){
      if(userIsGeneralManager()) return [...state.movimentos];
      return state.movimentos.filter(item => item.lojaId === currentUserStoreId());
    }

    function filteredCondutoresForUser(){
      if(userIsGeneralManager()) return [...state.condutores];
      return state.condutores.filter(item => item.lojaId === currentUserStoreId());
    }

    function filteredAutorizadoresForUser(){
      if(userIsGeneralManager()) return [...state.autorizadores];
      return state.autorizadores.filter(item => item.lojaId === currentUserStoreId());
    }

    async function loadCollectionsBase(){
      try{
        const [lojasSnap, movimentosSnap, condutoresSnap, autorizadoresSnap] = await Promise.all([
          getDocs(collection(db, "lojas")),
          getDocs(collection(db, "movimentos")),
          getDocs(collection(db, "condutores")),
          getDocs(collection(db, "autorizadores"))
        ]);

        state.lojas = [];
        state.lojasMap = {};
        lojasSnap.forEach(docSnap => {
          const data = docSnap.data();
          const item = {
            id: docSnap.id,
            ...data
          };
          state.lojas.push(item);
          state.lojasMap[item.id] = item;
        });

        state.movimentos = [];
        movimentosSnap.forEach(docSnap => {
          state.movimentos.push({
            id: docSnap.id,
            ...docSnap.data()
          });
        });

        state.condutores = [];
        condutoresSnap.forEach(docSnap => {
          state.condutores.push({
            id: docSnap.id,
            ...docSnap.data()
          });
        });

        state.autorizadores = [];
        autorizadoresSnap.forEach(docSnap => {
          state.autorizadores.push({
            id: docSnap.id,
            ...docSnap.data()
          });
        });

        state.movimentos.sort((a, b) => {
          const ta = a.data?.seconds ? a.data.seconds : new Date(a.data || 0).getTime() / 1000;
          const tb = b.data?.seconds ? b.data.seconds : new Date(b.data || 0).getTime() / 1000;
          return tb - ta;
        });

      }catch(error){
        debugError("Erro ao carregar coleções:", error);
        throw error;
      }

    async function loadUserProfile(uid){
      try{
        const userRef = doc(db, "usuarios", uid);
        const userSnap = await getDoc(userRef);

        if(!userSnap.exists()){
          throw new Error("Documento do usuário não encontrado em usuarios/{uid}");
        }

        const data = userSnap.data();

        if(data.ativo === false){
          throw new Error("Usuário desativado");
        }

        if(!data.role){
          throw new Error("Usuário sem role definida");
        }

        if(data.role !== Roles.GERENTE_GERAL && !data.lojaId){
          throw new Error("Usuário sem loja vinculada");
        }

        state.userProfile = {
          id: userSnap.id,
          ...data
        };
      }catch(error){
        debugError("Erro ao carregar perfil do usuário:", error);
        throw error;
      }
    }

    function buildDashboardMetrics(){
      const movimentos = filteredMovementsForUser();
      const condutores = filteredCondutoresForUser();
      const autorizadores = filteredAutorizadoresForUser();

      const patioMap = {};
      movimentos
        .slice()
        .sort((a,b) => {
          const ta = a.data?.seconds ? a.data.seconds : new Date(a.data || 0).getTime() / 1000;
          const tb = b.data?.seconds ? b.data.seconds : new Date(b.data || 0).getTime() / 1000;
          return ta - tb;
        })
        .forEach(item => {
          const key = `${item.lojaId || ""}__${normalizePlate(item.placa)}`;
          if(!normalizePlate(item.placa)) return;
          if(item.tipo === "entrada") patioMap[key] = item;
          if(item.tipo === "saida") delete patioMap[key];
        });

      const vehiclesInPatio = Object.keys(patioMap).length;
      const entradas = movimentos.filter(m => m.tipo === "entrada").length;
      const saidas = movimentos.filter(m => m.tipo === "saida").length;

      const cards = [
        {
          title: "Veículos no pátio",
          value: vehiclesInPatio,
          subtitle: userIsGeneralManager() ? "Somatório de todas as lojas" : "Veículos atualmente dentro da unidade"
        },
        {
          title: "Movimentações",
          value: movimentos.length,
          subtitle: "Total de entradas e saídas registradas"
        },
        {
          title: "Condutores",
          value: condutores.length,
          subtitle: "Cadastros disponíveis para a operação"
        },
        {
          title: "Autorizadores",
          value: autorizadores.length,
          subtitle: userCanCreateAutorizador() ? "Cadastros autorizados para a unidade" : "Acesso apenas para gerência"
        }
      ];

      if(userIsGeneralManager()){
        cards.push({
          title: "Lojas",
          value: state.lojas.length,
          subtitle: "Unidades cadastradas no sistema"
        });
      }else{
        cards.push({
          title: "Entradas / Saídas",
          value: `${entradas} / ${saidas}`,
          subtitle: "Resumo operacional da loja"
        });
      }

      return cards;
    }

    function readFileAsDataURL(file){
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(reader.error || new Error("Falha ao ler arquivo"));
        reader.readAsDataURL(file);
      });
    }

    async function getImageDataFromInput(inputId){
      const input = document.getElementById(inputId);
      const file = input?.files?.[0];
      if(!file) return "";
      if(!file.type?.startsWith("image/")) return "";
      const dataUrl = await readFileAsDataURL(file);
      return dataUrl;
    }

    function setPreview(previewId, dataUrl){
      const preview = document.getElementById(previewId);
      if(!preview) return;

      if(!dataUrl){
        preview.innerHTML = `<div class="photo-hint">Sem foto selecionada</div>`;
        return;
      }

      preview.innerHTML = `<img src="${dataUrl}" alt="Preview">`;
    }

    function wirePhotoPreview(inputId, previewId){
      const input = document.getElementById(inputId);
      if(!input) return;

      input.addEventListener("change", async () => {
        try{
          const dataUrl = await getImageDataFromInput(inputId);
          setPreview(previewId, dataUrl);
        }catch(e){
          debugError("Erro ao gerar preview:", e);
          setPreview(previewId, "");
        }
      });
    }

    function validateRequiredPhotoInput(inputId, label){
      const input = document.getElementById(inputId);
      const file = input?.files?.[0];
      if(!file) return `${label} é obrigatória.`;
      if(!file.type?.startsWith("image/")) return `${label} deve ser uma imagem.`;
      return "";
    }

    async function salvarEntrada(){
      const notice = document.getElementById("entradaNotice");
      clearNotice(notice);

      const lojaId = userIsGeneralManager()
        ? document.getElementById("entradaLoja")?.value || ""
        : currentUserStoreId();

      const placa = formatPlate(document.getElementById("entradaPlaca")?.value || "");
      const veiculo = (document.getElementById("entradaVeiculo")?.value || "").trim();
      const motivo = document.getElementById("entradaMotivo")?.value || "";
      const condutor = document.getElementById("entradaCondutor")?.value || "";
      const autorizador = document.getElementById("entradaAutorizador")?.value || "";
      const dano = document.getElementById("entradaDano")?.value || "nao";
      const observacao = (document.getElementById("entradaObs")?.value || "").trim();

      if(!lojaId){
        showNotice(notice, "Selecione a loja.");
        return;
      }

      if(!placa || !isValidPlate(placa)){
        showNotice(notice, "Informe uma placa válida (ABC-1234 ou ABC1D23).");
        return;
      }

      if(!veiculo){
        showNotice(notice, "Informe o veículo.");
        return;
      }

      if(!motivo){
        showNotice(notice, "Selecione o motivo da entrada.");
        return;
      }

      if(!condutor){
        showNotice(notice, "Selecione o condutor.");
        return;
      }

      if(!autorizador){
        showNotice(notice, "Selecione o autorizador.");
        return;
      }

      const errFrente = validateRequiredPhotoInput("fotoFrente", "Foto da frente");
      const errMala = validateRequiredPhotoInput("fotoMala", "Foto da mala");
      const errLatEsq = validateRequiredPhotoInput("fotoLatEsq", "Foto da lateral esquerda");
      const errLatDir = validateRequiredPhotoInput("fotoLatDir", "Foto da lateral direita");

      const photoErrors = [errFrente, errMala, errLatEsq, errLatDir].filter(Boolean);
      if(photoErrors.length){
        showNotice(notice, photoErrors[0]);
        return;
      }

      try{
        const [fotoFrente, fotoMala, fotoLateralEsq, fotoLateralDir] = await Promise.all([
          getImageDataFromInput("fotoFrente"),
          getImageDataFromInput("fotoMala"),
          getImageDataFromInput("fotoLatEsq"),
          getImageDataFromInput("fotoLatDir")
        ]);

        if(!fotoFrente || !fotoMala || !fotoLateralEsq || !fotoLateralDir){
          showNotice(notice, "Envie todas as 4 fotos antes de salvar.");
          return;
        }

        await addDoc(collection(db, "movimentos"), {
          tipo: "entrada",
          lojaId,
          lojaNome: getStoreName(lojaId),
          placa,
          veiculo,
          motivo,
          condutor,
          autorizador,
          dano,
          observacao,
          fotos: {
            frente: fotoFrente,
            mala: fotoMala,
            lateralEsq: fotoLateralEsq,
            lateralDir: fotoLateralDir
          },
          criadoPorUid: state.authUser.uid,
          criadoPorNome: state.userProfile?.nome || state.authUser?.email || "",
          data: new Date()
        });

        await refreshAfterWrite();
        showNotice(notice, "Entrada registrada com sucesso.", "success");
        renderEntrada();
      }catch(error){
        debugError("Erro ao salvar entrada:", error);
        showNotice(notice, "Não foi possível salvar a entrada.");
      }
    }

    }

    async function salvarCondutor(){
      const notice = document.getElementById("condutorNotice");
      clearNotice(notice);

      const lojaId = userIsGeneralManager()
        ? document.getElementById("condutorLoja")?.value || ""
        : currentUserStoreId();

      const nome = (document.getElementById("condutorNome")?.value || "").trim();
      const cpf = document.getElementById("condutorCPF")?.value || "";
      const cargo = (document.getElementById("condutorCargo")?.value || "").trim();

      if(!lojaId){
        showNotice(notice, "Selecione a loja.");
        return;
      }

      if(!nome){
        showNotice(notice, "Informe o nome do condutor.");
        return;
      }

      if(!isValidCPF(cpf)){
        showNotice(notice, "Informe um CPF válido.");
        return;
      }

      if(!cargo){
        showNotice(notice, "Informe o cargo do condutor.");
        return;
      }

      try{
        await addDoc(collection(db, "condutores"), {
          lojaId,
          lojaNome: getStoreName(lojaId),
          nome,
          cpf: onlyDigits(cpf),
          cargo,
          criadoPorUid: state.authUser.uid,
          criadoPorNome: state.userProfile?.nome || state.authUser?.email || "",
          criadoEm: new Date()
        });

        await refreshAfterWrite();
        showNotice(notice, "Condutor cadastrado com sucesso.", "success");
        renderCondutor();
      }catch(error){
        debugError("Erro ao salvar condutor:", error);
        showNotice(notice, "Não foi possível salvar o condutor.");
      }
    }

    function renderConsulta(){
      const storeFilterHTML = userIsGeneralManager()
        ? `
          <div class="form-group">
            <label for="filtroLojaConsulta">Loja</label>
            <select class="select" id="filtroLojaConsulta">
              <option value="">Todas as lojas</option>
              ${state.lojas.map(loja => `<option value="${loja.id}">${loja.nome || loja.id}</option>`).join("")}
            </select>
          </div>
        `
        : `
          <div class="form-group">
            <label>Loja</label>
            <input class="input" value="${getStoreName(currentUserStoreId())}" disabled>
          </div>
        `;

      renderPanel(
        "Consulta",
        userIsGeneralManager()
          ? "Consulte todas as movimentações de todas as unidades."
          : "Consulte as movimentações da sua unidade.",
        `
          <div class="grid">
            ${storeFilterHTML}

            <div class="form-group">
              <label for="filtroPlacaConsulta">Placa</label>
              <input class="input" id="filtroPlacaConsulta" data-mask="plate" maxlength="8" placeholder="ABC-1234 ou ABC1D23">
            </div>

            <div class="form-group">
              <label for="filtroTipoConsulta">Tipo</label>
              <select class="select" id="filtroTipoConsulta">
                <option value="">Todos</option>
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
              </select>
            </div>

            <div class="form-group">
              <label for="filtroTextoConsulta">Busca geral</label>
              <input class="input" id="filtroTextoConsulta" maxlength="80" placeholder="Condutor, veículo, autorizador, motivo...">
            </div>
          </div>

          <div class="actions">
            <button class="btn btn-primary" id="btnFiltrarConsulta">Filtrar</button>
            <button class="btn btn-light" id="btnLimparConsulta">Limpar</button>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Tipo</th>
                  <th>Loja</th>
                  <th>Placa</th>
                  <th>Veículo</th>
                  <th>Motivo</th>
                  <th>Condutor</th>
                  <th>Autorizador</th>
                  <th>Dano</th>
                  <th>Observação</th>
                  <th>Fotos</th>
                  <th>Registrado por</th>
                </tr>
              </thead>
              <tbody id="consultaBody"></tbody>
            </table>
          </div>

          <div class="empty" id="consultaEmpty"></div>
        `
      );

      attachInputMasks();
      document.getElementById("btnFiltrarConsulta").addEventListener("click", applyConsultaFilter);
      document.getElementById("btnLimparConsulta").addEventListener("click", renderConsulta);

    function applyConsultaFilter(){
      const body = document.getElementById("consultaBody");
      const empty = document.getElementById("consultaEmpty");

      if(!body || !empty) return;

      const lojaId = userIsGeneralManager()
        ? (document.getElementById("filtroLojaConsulta")?.value || "")
        : currentUserStoreId();

      const placa = normalizePlate(document.getElementById("filtroPlacaConsulta")?.value || "");
      const tipo = (document.getElementById("filtroTipoConsulta")?.value || "").toLowerCase();
      const texto = (document.getElementById("filtroTextoConsulta")?.value || "").trim().toLowerCase();

      let items = filteredMovementsForUser();

      if(lojaId){
        items = items.filter(item => item.lojaId === lojaId);
      }

      if(placa){
        items = items.filter(item => normalizePlate(item.placa).includes(placa));
      }

      if(tipo){
        items = items.filter(item => String(item.tipo || "").toLowerCase() === tipo);
      }

      if(texto){
        items = items.filter(item => {
          const haystack = [
            item.veiculo,
            item.motivo,
            item.condutor,
            item.autorizador,
            item.observacao,
            item.criadoPorNome,
            item.lojaNome
          ].join(" ").toLowerCase();
          return haystack.includes(texto);
        });
      }

      items.sort((a,b) => {
        const ta = a.data?.seconds ? a.data.seconds : new Date(a.data || 0).getTime() / 1000;
        const tb = b.data?.seconds ? b.data.seconds : new Date(b.data || 0).getTime() / 1000;
        return tb - ta;
      });

      body.innerHTML = items.map(item => {
        const temFotos = item?.fotos?.frente && item?.fotos?.mala && item?.fotos?.lateralEsq && item?.fotos?.lateralDir;
        return `
          <tr>
            <td>${formatDate(item.data)}</td>
            <td>
              <div class="row-badges">
                ${item.tipo === "entrada"
                  ? `<span class="badge badge-green">Entrada</span>`
                  : `<span class="badge badge-red">Saída</span>`
                }
              </div>
            </td>
            <td>${getStoreName(item.lojaId)}</td>
            <td>${item.placa || "-"}</td>
            <td>${item.veiculo || "-"}</td>
            <td>${item.motivo || "-"}</td>
            <td>${item.condutor || "-"}</td>
            <td>${item.autorizador || "-"}</td>
            <td>${item.dano === "sim" ? "Com dano" : item.dano === "nao" ? "Sem dano" : "-"}</td>
            <td>${item.observacao || "-"}</td>
            <td>${temFotos ? "4 fotos" : "-"}</td>
            <td>${item.criadoPorNome || "-"}</td>
          </tr>
        `;
      }).join("");

      empty.textContent = items.length ? "" : "Nenhum registro encontrado.";
    }

    function renderResumoLojas(){
      if(!userIsGeneralManager()){
        renderPanel(
          "Acesso restrito",
          "Esta função não está disponível para seu perfil.",
          `<div class="empty">Somente o gerente geral pode ver o resumo de todas as lojas.</div>`
        );
        return;
      }

      const cards = state.lojas.map(loja => {
        const movs = state.movimentos.filter(m => m.lojaId === loja.id);
        const conds = state.condutores.filter(c => c.lojaId === loja.id);
        const auts = state.autorizadores.filter(a => a.lojaId === loja.id);

        const patioMap = {};
        movs
          .slice()
          .sort((a,b) => {
            const ta = a.data?.seconds ? a.data.seconds : new Date(a.data || 0).getTime() / 1000;
            const tb = b.data?.seconds ? b.data.seconds : new Date(b.data || 0).getTime() / 1000;
            return ta - tb;
          })
          .forEach(item => {
            const key = normalizePlate(item.placa);
            if(!key) return;
            if(item.tipo === "entrada") patioMap[key] = true;
            if(item.tipo === "saida") delete patioMap[key];
          });

        return `
          <div class="store-card">
            <h4>${loja.nome || loja.id}</h4>
            <div class="meta">
              <div><strong>ID:</strong> ${loja.id}</div>
              <div><strong>Veículos no pátio:</strong> ${Object.keys(patioMap).length}</div>
              <div><strong>Movimentações:</strong> ${movs.length}</div>
              <div><strong>Condutores:</strong> ${conds.length}</div>
              <div><strong>Autorizadores:</strong> ${auts.length}</div>
            </div>
          </div>
        `;
      }).join("");

      renderPanel(
        "Resumo por loja",
        "Acompanhe os principais números de cada unidade.",
        `
          <div class="store-grid">
            ${cards || `<div class="empty">Nenhuma loja cadastrada.</div>`}
          </div>
        `
      );
    }

    async function refreshAfterWrite(){
      await loadCollectionsBase();
      renderDashboard();
      renderShellInfo();
    }

    async function login(){
      clearNotice(el.loginNotice);

      const email = el.loginEmail.value.trim();
      const senha = el.loginSenha.value;

      if(!email || !senha){
        showNotice(el.loginNotice, "Preencha e-mail e senha.");
        return;
      }

      el.btnLogin.disabled = true;

      try{
        await signInWithEmailAndPassword(auth, email, senha);
      }catch(error){
        debugError("Erro no login:", error);
        showNotice(el.loginNotice, "Não foi possível entrar. Verifique seus dados.");
      }finally{
        el.btnLogin.disabled = false;
      }
    }

    async function logout(){
      try{
        await signOut(auth);
      }catch(error){
        debugError("Erro ao sair:", error);
      }
    }

    async function initializeAuthenticatedUser(user){
      state.authUser = user;

      await loadUserProfile(user.uid);
      await loadCollectionsBase();

      renderShellInfo();
      renderDashboard();
      buildMenu();
      renderDashboardHome();

      el.loginView.style.display = "none";
      el.topbar.style.display = "flex";
      el.appView.style.display = "block";
    }

    function resetAppState(){
      state.authUser = null;
      state.userProfile = null;
      state.lojas = [];
      state.lojasMap = {};
      state.movimentos = [];
      state.condutores = [];
      state.autorizadores = [];

      el.topbar.style.display = "none";
      el.appView.style.display = "none";
      el.loginView.style.display = "flex";

      el.dashboardCards.innerHTML = "";
      el.menuBar.innerHTML = "";
      el.mainPanel.innerHTML = `
        <div class="card-header">
          <div>
            <h3>Bem-vindo</h3>
            <p>Selecione uma função no menu acima.</p>
          </div>
        </div>
      `;
    }

    el.btnLogin.addEventListener("click", login);
    el.btnLogout.addEventListener("click", logout);

    el.loginSenha.addEventListener("keydown", (e) => {
      if(e.key === "Enter") login();
    });

    onAuthStateChanged(auth, async (user) => {
      if(!user){
        resetAppState();
        return;
      }

      try{
        await initializeAuthenticatedUser(user);
      }catch(error){
        debugError("Falha ao inicializar usuário autenticado:", error);
        await signOut(auth);
        resetAppState();
        showNotice(el.loginNotice, "Seu acesso não está configurado corretamente.");
      }
    });

    debugLog("Sistema carregado.");
  </script>
