<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle Veicular</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Inter;
margin:0;
background:#eef2f7;
}

header{
height:70px;
background:#111827;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
}

header img{
height:38px;
}

main{
padding:25px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
margin-bottom:20px;
}

.menu{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.menu button{
background:#2563eb;
border:none;
color:white;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

input,select,textarea{
padding:10px;
border-radius:6px;
border:1px solid #ccc;
width:100%;
}

textarea{
grid-column:span 2;
}

.actions{
margin-top:15px;
display:flex;
gap:10px;
}

.actions button{
border:none;
padding:10px 16px;
border-radius:6px;
cursor:pointer;
font-weight:600;
}

.save{background:#10b981;color:white;}
.cancel{background:#e5e7eb;}

.photo-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:15px;
}

.photo-grid input{
border:1px dashed #bbb;
padding:8px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
}

th{
background:#f3f4f6;
text-align:left;
}

#login{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.loginCard{
background:white;
padding:40px;
border-radius:10px;
width:350px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.loginCard input{
margin-bottom:10px;
}

.loginCard button{
width:100%;
background:#2563eb;
border:none;
color:white;
padding:12px;
border-radius:8px;
font-weight:600;
cursor:pointer;
}

</style>
</head>

<body>

<header id="topbar" style="display:none">

<img src="vigorito.png">

<div>
Olá, <span id="username"></span>
</div>

</header>

<div id="login">

<div class="loginCard">

<h2>Login</h2>

<input id="email" placeholder="Email">
<input id="senha" type="password" placeholder="Senha">

<button onclick="login()">Entrar</button>

</div>

</div>

<main id="app" style="display:none">

<div class="menu">

<button onclick="abrir('entrada')">Entrada</button>
<button onclick="abrir('saida')">Saída</button>
<button onclick="abrir('condutor')">Condutor</button>
<button onclick="abrir('autorizador')">Autorizador</button>
<button onclick="abrir('consulta')">Consulta</button>

</div>

<div id="painel" class="card">
Selecione uma ação
</div>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCp9SBiDUD5YaCGm8Qzbb7uv3Goa-7eKU0",
authDomain: "controle-ponto-26d34.firebaseapp.com",
projectId: "controle-ponto-26d34",
storageBucket: "controle-ponto-26d34.firebasestorage.app",
messagingSenderId: "730360923157",
appId: "1:730360923157:web:cdd6ea1eeed6fd717d3a1c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.login = async ()=>{

let email=document.getElementById("email").value
let senha=document.getElementById("senha").value

await signInWithEmailAndPassword(auth,email,senha)

}

onAuthStateChanged(auth,user=>{

if(user){

document.getElementById("login").style.display="none"
document.getElementById("app").style.display="block"
document.getElementById("topbar").style.display="flex"

document.getElementById("username").innerText=user.email

}

})

window.abrir=(t)=>{

let html=""

if(t=="entrada"){

html=`

<h3>Entrada de veículo</h3>

<div class="form-grid">

<input id="placa" placeholder="Placa">
<input id="veiculo" placeholder="Veículo">

<select id="condutor"></select>
<select id="autorizador"></select>

<select id="dano">
<option>Sem dano</option>
<option>Com dano</option>
</select>

<textarea placeholder="Observação"></textarea>

</div>

<h4>Fotos do veículo</h4>

<div class="photo-grid">

<input type="file">
<input type="file">
<input type="file">
<input type="file">
<input type="file">
<input type="file">
<input type="file">
<input type="file">

</div>

<div class="actions">

<button class="save" onclick="salvarEntrada()">Salvar</button>

</div>

`

}

if(t=="condutor"){

html=`

<h3>Novo condutor</h3>

<div class="form-grid">

<input id="nomeCondutor" placeholder="Nome completo">
<input id="cpfCondutor" placeholder="CPF">
<input id="cargoCondutor" placeholder="Cargo">

</div>

<div class="actions">

<button class="save" onclick="salvarCondutor()">Salvar</button>

</div>

`

}

if(t=="autorizador"){

html=`

<h3>Novo autorizador</h3>

<div class="form-grid">

<input id="nomeAut" placeholder="Nome completo">
<input id="cpfAut" placeholder="CPF">
<input id="cargoAut" placeholder="Cargo">

</div>

<div class="actions">

<button class="save" onclick="salvarAut()">Salvar</button>

</div>

`

}

if(t=="consulta"){

html=`

<h3>Consulta</h3>

<input id="buscaPlaca" placeholder="Placa">

<button onclick="buscar()">Buscar</button>

<table>

<thead>
<tr>
<th>Data</th>
<th>Tipo</th>
<th>Placa</th>
<th>Veículo</th>
</tr>
</thead>

<tbody id="resultado"></tbody>

</table>

`

}

document.getElementById("painel").innerHTML=html

carregarCondutores()
carregarAutorizadores()

}

async function carregarCondutores(){

let q=await getDocs(collection(db,"condutores"))

let s=document.getElementById("condutor")

if(!s)return

s.innerHTML=""

q.forEach(doc=>{

let d=doc.data()

s.innerHTML+=`<option>${d.nome}</option>`

})

}

async function carregarAutorizadores(){

let q=await getDocs(collection(db,"autorizadores"))

let s=document.getElementById("autorizador")

if(!s)return

s.innerHTML=""

q.forEach(doc=>{

let d=doc.data()

s.innerHTML+=`<option>${d.nome}</option>`

})

}

window.salvarCondutor=async()=>{

await addDoc(collection(db,"condutores"),{

nome:document.getElementById("nomeCondutor").value,
cpf:document.getElementById("cpfCondutor").value,
cargo:document.getElementById("cargoCondutor").value

})

alert("Condutor salvo")

}

window.salvarAut=async()=>{

await addDoc(collection(db,"autorizadores"),{

nome:document.getElementById("nomeAut").value,
cpf:document.getElementById("cpfAut").value,
cargo:document.getElementById("cargoAut").value

})

alert("Autorizador salvo")

}

window.salvarEntrada=async()=>{

await addDoc(collection(db,"movimentos"),{

tipo:"entrada",
placa:document.getElementById("placa").value,
veiculo:document.getElementById("veiculo").value,
data:new Date()

})

alert("Entrada registrada")

}

window.buscar=async()=>{

let placa=document.getElementById("buscaPlaca").value

let q=await getDocs(collection(db,"movimentos"))

let tb=document.getElementById("resultado")

tb.innerHTML=""

q.forEach(doc=>{

let d=doc.data()

if(!placa || d.placa.includes(placa)){

tb.innerHTML+=`

<tr>
<td>${new Date(d.data).toLocaleString()}</td>
<td>${d.tipo}</td>
<td>${d.placa}</td>
<td>${d.veiculo}</td>
</tr>

`

}

})

}

</script>

</body>
</html>
