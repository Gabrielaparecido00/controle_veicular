<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Controle Veicular</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#eef2f7;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --line:#dbe4ee;
      --primary:#2563eb;
      --primary-dark:#1d4ed8;
      --success:#10b981;
      --warning:#f59e0b;
      --danger:#ef4444;
      --header:#0f172a;
      --shadow:0 16px 40px rgba(15,23,42,.08);
      --radius:16px;

      --touch:52px;
      --fs:16px;
    }

    *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

    body{
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      font-size:var(--fs);
      overscroll-behavior: none;
    }

    button,input,select,textarea{ font:inherit; }
    .hidden{ display:none !important; }

    header{
      height:76px;
      background:var(--header);
      color:#fff;
      display:none;
      align-items:center;
      justify-content:space-between;
      padding:0 22px;
      box-shadow:0 8px 24px rgba(0,0,0,.18);
      position:sticky;
      top:0;
      z-index:100;
    }

    .brand{ display:flex; align-items:center; gap:14px; min-width:0; }

    /* apenas logo */
    .brand-logo{
      height:46px;
      width:auto;
      max-width:320px;
      object-fit:contain;
      display:block;
    }

    .brand-text{ display:flex; flex-direction:column; gap:2px; min-width:0; }
    .brand-text strong{ font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.1; }
    .brand-text span{ font-size:13px; color:#cbd5e1; }

    .footerbar{
      position:fixed;
      left:0; right:0; bottom:0;
      z-index:120;
      background:rgba(15,23,42,.98);
      color:#fff;
      padding:12px 16px calc(12px + env(safe-area-inset-bottom));
      box-shadow:0 -10px 28px rgba(0,0,0,.25);
      display:none;
    }

    .footerbar .wrap{
      max-width:1420px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .chips{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

    .chip{
      background:rgba(255,255,255,.10);
      color:#fff;
      padding:10px 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
      line-height:1;
      white-space:nowrap;
    }

    .btn-topbar{
      border:none;
      background:#1e293b;
      color:#fff;
      padding:12px 16px;
      border-radius:14px;
      cursor:pointer;
      font-weight:900;
      min-height:var(--touch);
      min-width:120px;
    }
    .btn-topbar:active{ transform:scale(.99); }

    #loginView{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .login-wrap{
      width:100%;
      max-width:460px;
      background:var(--card);
      border-radius:22px;
      padding:34px;
      box-shadow:var(--shadow);
      border:1px solid #edf2f7;
    }

    .login-wrap h1{ font-size:30px; margin-bottom:8px; }
    .login-wrap p{ font-size:15px; color:var(--muted); margin-bottom:22px; line-height:1.55; }

    .form-group{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:14px;
    }

    .form-group label{
      font-size:14px;
      font-weight:900;
      color:#334155;
      display:flex;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
    }

    .req{ color:#ef4444; font-weight:900; font-size:14px; }

    .input, .select, .textarea{
      width:100%;
      padding:14px 16px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      color:var(--text);
      outline:none;
      transition:.18s;
      min-height:var(--touch);
      font-size:16px;
    }

    .textarea{ resize:vertical; min-height:120px; }

    .input:focus, .select:focus, .textarea:focus{
      border-color:#93c5fd;
      box-shadow:0 0 0 4px rgba(37,99,235,.10);
    }

    .btn{
      border:none;
      border-radius:14px;
      padding:14px 16px;
      font-weight:900;
      cursor:pointer;
      transition:.18s;
      min-height:var(--touch);
      font-size:16px;
    }

    .btn:disabled{ opacity:.55; cursor:not-allowed; }
    .btn-primary{ background:var(--primary); color:#fff; }
    .btn-primary:hover{ background:var(--primary-dark); }
    .btn-success{ background:var(--success); color:#fff; }
    .btn-success:hover{ filter:brightness(.97); }
    .btn-danger{ background:var(--danger); color:#fff; }
    .btn-danger:hover{ filter:brightness(.97); }
    .btn-light{ background:#e2e8f0; color:#0f172a; }
    .btn-light:hover{ background:#cfd8e3; }
    .btn-block{ width:100%; }

    .notice{
      display:none;
      margin-top:14px;
      padding:12px 14px;
      border-radius:14px;
      font-size:15px;
      line-height:1.45;
      word-break:break-word;
    }

    .notice.show{ display:block; }
    .notice.error{ background:#fee2e2; color:#991b1b; }
    .notice.success{ background:#dcfce7; color:#166534; }
    .notice.info{ background:#dbeafe; color:#1e40af; }
    .notice.warn{ background:#ffedd5; color:#9a3412; }

    #appView{
      display:none;
      max-width:1420px;
      margin:0 auto;
      padding:24px;
      padding-bottom:140px;
    }

    .hero{
      margin-bottom:18px;
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:flex-start;
      flex-wrap:wrap;
    }

    .hero h2{ font-size:30px; margin-bottom:8px; }
    .hero p{ color:var(--muted); font-size:15px; line-height:1.55; }

    .dashboard{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:14px;
      margin-bottom:18px;
    }

    .stat{
      background:var(--card);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
      border:1px solid #edf2f7;
    }

    .stat small{ display:block; color:var(--muted); margin-bottom:10px; font-size:14px; font-weight:700; }
    .stat strong{ display:block; font-size:34px; line-height:1; margin-bottom:8px; font-weight:900; }
    .stat span{ color:#475569; font-size:14px; }

    .menu{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:18px;
    }

    .menu .btn{ border-radius:16px; padding:14px 16px; }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:24px;
      border:1px solid #edf2f7;
    }

    .card-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    .card-header h3{ font-size:26px; margin-bottom:6px; }
    .card-header p{ color:var(--muted); font-size:15px; line-height:1.5; }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .full{ grid-column:1 / -1; }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:18px;
    }

    .table-wrap{
      overflow:auto;
      border:1px solid #e5edf5;
      border-radius:16px;
      background:#fff;
      margin-top:18px;
      -webkit-overflow-scrolling: touch;
    }

    table{ width:100%; border-collapse:collapse; min-width:1100px; }

    th,td{
      padding:14px 16px;
      border-bottom:1px solid #eef2f7;
      text-align:left;
      vertical-align:top;
      font-size:15px;
    }

    th{
      background:#f8fafc;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.05em;
      color:#475569;
      font-weight:900;
      position:sticky;
      top:0;
      z-index:1;
    }

    tr.row-clickable{ cursor:pointer; }
    tr.row-clickable:active{ background:#f8fafc; }

    .empty{ margin-top:14px; color:var(--muted); font-size:15px; }

    .badge{
      display:inline-flex;
      align-items:center;
      padding:7px 11px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      line-height:1;
      white-space:nowrap;
    }

    .badge-green{ background:#dcfce7; color:#166534; }
    .badge-red{ background:#fee2e2; color:#991b1b; }
    .badge-blue{ background:#dbeafe; color:#1d4ed8; }
    .badge-amber{ background:#ffedd5; color:#9a3412; }

    .photo-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
      gap:12px;
      margin-top:8px;
    }

    .photo-card{
      border:1px solid #e5edf5;
      border-radius:16px;
      padding:12px;
      background:#fff;
    }

    .photo-card strong{
      display:block;
      font-size:14px;
      margin-bottom:10px;
      color:#0f172a;
      font-weight:900;
    }

    .photo-preview{
      width:100%;
      height:170px;
      border-radius:14px;
      background:#f1f5f9;
      border:1px dashed #cbd5e1;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      margin-bottom:10px;
      position:relative;
    }

    .photo-preview img{ width:100%; height:100%; object-fit:cover; display:block; }

    .photo-hint{
      font-size:13px;
      color:#64748b;
      text-align:center;
      padding:10px;
      line-height:1.35;
    }

    /* input invisível */
    .file-input{
      position:absolute;
      left:-99999px;
      width:1px;
      height:1px;
      opacity:0;
    }

    .btn-cam{
      width:100%;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      border:1px solid #dbe4ee;
      background:#fff;
      color:#0f172a;
      border-radius:14px;
      padding:12px 14px;
      font-weight:900;
      min-height:var(--touch);
      cursor:pointer;
    }
    .btn-cam:active{ transform:scale(.99); }

    .subtle{
      font-size:13px;
      color:#64748b;
      line-height:1.4;
      margin-top:6px;
    }

    .section-title{
      margin:20px 0 10px;
      font-size:17px;
      font-weight:900;
      color:#1e293b;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.55);
      z-index:200;
      display:none;
      padding:18px;
      align-items:center;
      justify-content:center;
    }

    .modal.show{ display:flex; }

    .modal-card{
      width:100%;
      max-width:980px;
      background:#fff;
      border-radius:20px;
      box-shadow:0 24px 60px rgba(0,0,0,.22);
      overflow:hidden;
      border:1px solid #e5edf5;
      max-height:calc(100vh - 32px);
      display:flex;
      flex-direction:column;
    }

    .modal-head{
      padding:18px 18px 12px 18px;
      border-bottom:1px solid #edf2f7;
      display:flex;
      gap:10px;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
      background:#fff;
    }

    .modal-head h4{ font-size:18px; font-weight:900; margin-bottom:4px; }
    .modal-head p{ color:#64748b; font-size:14px; line-height:1.4; }

    .modal-body{
      padding:16px 18px 18px 18px;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
    }

    .detail-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px;
      margin-bottom:14px;
    }

    .detail-item{
      background:#f8fafc;
      border:1px solid #e5edf5;
      border-radius:14px;
      padding:12px 14px;
    }

    .detail-item small{
      display:block;
      color:#64748b;
      font-weight:800;
      font-size:12px;
      margin-bottom:6px;
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    .detail-item div{
      font-weight:800;
      color:#0f172a;
      font-size:15px;
      line-height:1.35;
      word-break:break-word;
    }

    .thumbs{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));
      gap:10px;
      margin-top:10px;
    }

    .thumb{
      border:1px solid #e5edf5;
      border-radius:14px;
      overflow:hidden;
      background:#fff;
    }

    .thumb img{
      width:100%;
      height:160px;
      object-fit:cover;
      display:block;
    }

    .thumb .cap{
      padding:10px 12px;
      font-size:13px;
      color:#334155;
      font-weight:900;
      border-top:1px solid #eef2f7;
    }

    .modal-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      padding:14px 18px 18px 18px;
      border-top:1px solid #edf2f7;
      background:#fff;
    }

    @media (max-width:900px){
      .grid{ grid-template-columns:1fr; }
      .hero h2{ font-size:26px; }
      header{ padding:12px 14px; height:auto; }
      .detail-grid{ grid-template-columns:1fr; }
      table{ min-width:980px; }
      .brand-logo{ max-width:260px; }
    }
  </style>
</head>

<body>

  <header id="topbar">
    <div class="brand">
      <img class="brand-logo" src="vigorito.png" alt="Vigorito">
      <div class="brand-text">
        <strong>Controle Veicular</strong>
        <span id="headerStoreText">Carregando unidade...</span>
      </div>
    </div>
  </header>

  <footer class="footerbar" id="footerbar">
    <div class="wrap">
      <div class="chips">
        <div class="chip" id="footerRoleText">Perfil</div>
        <div class="chip" id="footerUserText">Usuário</div>
        <div class="chip" id="footerStoreText">Unidade</div>
      </div>
      <button class="btn-topbar" id="btnLogout">Sair</button>
    </div>
  </footer>

  <section id="loginView">
    <div class="login-wrap">
      <h1>Acesso ao sistema</h1>
      <p>Entre com seu e-mail e senha para acessar.</p>

      <div class="form-group">
        <label for="loginEmail">E-mail <span class="req">*</span></label>
        <input class="input" id="loginEmail" type="email" placeholder="seuemail@empresa.com">
      </div>

      <div class="form-group">
        <label for="loginSenha">Senha <span class="req">*</span></label>
        <input class="input" id="loginSenha" type="password" placeholder="Digite sua senha">
      </div>

      <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
      <div id="loginNotice" class="notice"></div>
    </div>
  </section>

  <main id="appView">
    <section class="hero">
      <div>
        <h2 id="heroTitle">Painel</h2>
        <p id="heroSubtitle">Carregando informações...</p>
      </div>
    </section>

    <section class="dashboard" id="dashboardCards"></section>
    <nav class="menu" id="menuBar"></nav>

    <section class="card" id="mainPanel">
      <div class="card-header">
        <div>
          <h3>Bem-vindo</h3>
          <p>Selecione uma função no menu acima.</p>
        </div>
      </div>
    </section>
  </main>

  <div class="modal" id="detailModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="modal-head">
        <div>
          <h4 id="detailTitle">Detalhes</h4>
          <p id="detailSub">...</p>
        </div>
        <button class="btn btn-light" id="btnCloseModal" style="min-width:120px;">Fechar</button>
      </div>

      <div class="modal-body" id="detailBody"></div>

      <div class="modal-actions">
        <button class="btn btn-primary" id="btnEditRegistro">Editar</button>
        <button class="btn btn-success hidden" id="btnSaveRegistro">Salvar alterações</button>

        <!-- ✅ NOVO: Marcar alerta como resolvido (somente gerência e só quando houver alerta pendente) -->
        <button class="btn btn-success hidden" id="btnResolveAlert">Marcar alerta como resolvido</button>

        <button class="btn btn-light" id="btnExportRegistro">Exportar registro</button>
        <button class="btn btn-light" id="btnCloseModal2">Fechar</button>
      </div>
    </div>
  </div>

    function clearNotice(target){ target.className = "notice"; target.textContent = ""; }
    function showNotice(target, message, type="error"){ target.className = `notice show ${type}`; target.textContent = message; }

    function onlyDigits(v){ return String(v||"").replace(/\D/g,""); }
    function formatCPF(v){
      const d = onlyDigits(v).slice(0,11);
      return d.replace(/^(\d{3})(\d)/,"$1.$2").replace(/^(\d{3})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d)/,".$1-$2");
    }

    function isValidCPF(cpf){
      const c = onlyDigits(cpf);
      if(c.length !== 11) return false;
      if(/^(\d)\1{10}$/.test(c)) return false;
      let sum=0;
      for(let i=0;i<9;i++) sum += Number(c[i])*(10-i);
      let first=(sum*10)%11; if(first===10) first=0;
      if(first !== Number(c[9])) return false;
      sum=0;
      for(let i=0;i<10;i++) sum += Number(c[i])*(11-i);
      let second=(sum*10)%11; if(second===10) second=0;
      if(second !== Number(c[10])) return false;
      return true;
    }

    function normalizePlate(v){ return String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
    function isValidPlate(p){
      const c = normalizePlate(p);
      return /^[A-Z]{3}[0-9]{4}$/.test(c) || /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/.test(c);
    }
    function formatPlate(v){
      const c = normalizePlate(v).slice(0,7);
      if(!c) return "";
      if(c.length<=3) return c;
      return c.slice(0,3)+"-"+c.slice(3);
    }

    function formatDate(value){
      try{
        if(!value) return "-";
        if(value.seconds) return new Date(value.seconds*1000).toLocaleString("pt-BR");
        return new Date(value).toLocaleString("pt-BR");
      }catch(e){ return "-"; }
    }
    function dateValueToMillis(value){
      if(!value) return null;
      if(value.seconds) return value.seconds*1000;
      const t = new Date(value).getTime();
      return isNaN(t) ? null : t;
    }
    function dateToRangeStart(dStr){ if(!dStr) return null; return new Date(dStr+"T00:00:00").getTime(); }
    function dateToRangeEnd(dStr){ if(!dStr) return null; return new Date(dStr+"T23:59:59").getTime(); }

    function computePatioCount(movimentos){
      const patioMap = {};
      movimentos
        .slice()
        .sort((a,b) => (dateValueToMillis(a.data)||0) - (dateValueToMillis(b.data)||0))
        .forEach(item => {
          const plate = normalizePlate(item.placa);
          if(!plate) return;
          const key = userIsGeneralManager() ? `${item.lojaId||""}__${plate}` : plate;
          if(item.tipo==="entrada") patioMap[key]=true;
          if(item.tipo==="saida") delete patioMap[key];
        });
      return Object.keys(patioMap).length;
    }

    // ✅ NOVO: checar se placa está no pátio antes de salvar SAÍDA (para alerta)
    function isPlateCurrentlyInPatioForStore(lojaId, placa){
      const plate = normalizePlate(placa);
      if(!lojaId || !plate) return false;

      const items = state.movimentos
        .filter(m => m.lojaId === lojaId && normalizePlate(m.placa) === plate)
        .slice()
        .sort((a,b) => (dateValueToMillis(a.data)||0) - (dateValueToMillis(b.data)||0));

      let inside = false;
      for(const m of items){
        if(m.tipo === "entrada") inside = true;
        if(m.tipo === "saida") inside = false;
      }
      return inside;
    }

      const item = state.selectedMovimento;
      if(!item) return;

      if(!userCanResolveAlert()){
        alert("Apenas gerentes podem marcar alerta como resolvido.");
        return;
      }
      if(!itemIsOpenAlert(item)){
        alert("Este registro não possui alerta pendente.");
        return;

      const ok = confirm("Marcar este ALERTA como resolvido?");
      if(!ok) return;

      try{
        await updateDoc(doc(db, Collections.MOVIMENTOS, item.id), {
          alertaResolvido: true,

          alertaResolvidoPorUid: state.authUser.uid,

        renderDetailView(state.selectedMovimento);
        syncResolveAlertButton();

    // ========= FOTO (Firestore-only) =========
    // Compressão para não estourar 1MB no Firestore.
    const PHOTO_MAX_W = 900;
    const PHOTO_MAX_H = 900;
    const PHOTO_QUALITY = 0.55;
    const PHOTO_MAX_BYTES = 160 * 1024;

    function fileFromInput(inputId){
      const input = document.getElementById(inputId);
      const file = input?.files?.[0] || null;
      if(!file) return null;
      if(!file.type?.startsWith("image/")) return null;
      return file;
    }

    function setPreview(previewId, fileOrUrl){
      const preview = document.getElementById(previewId);
      if(!preview) return;
      if(!fileOrUrl){
        preview.innerHTML = `<div class="photo-hint">Sem foto</div>`;
        return;
      }
      if(typeof fileOrUrl === "string"){
        preview.innerHTML = `<img src="${fileOrUrl}" alt="Preview">`;
        return;
      }
      const url = URL.createObjectURL(fileOrUrl);
      preview.innerHTML = `<img src="${url}" alt="Preview">`;
    }

    function wirePhotoPreview(inputId, previewId){
      const input = document.getElementById(inputId);
      if(!input) return;
      input.addEventListener("change", () => {
        const f = fileFromInput(inputId);
        setPreview(previewId, f);
      });
    }

    function photoCaptureCard(label, inputId, previewId){
      return `
        <div class="photo-card">
          <strong>${label}</strong>
          <div class="photo-preview" id="${previewId}"><div class="photo-hint">Sem foto</div></div>
          <input class="file-input" id="${inputId}" type="file" accept="image/*" capture="environment">
          <label class="btn-cam" for="${inputId}">Abrir câmera</label>
        </div>
      `;
    }

    function estimateBase64Bytes(dataUrl){
      const base64 = String(dataUrl||"").split(",")[1] || "";
      return Math.floor(base64.length * 3 / 4);
    }

    async function compressImageToDataURL(file){
      const img = await createImageBitmap(file);
      let w = img.width;
      let h = img.height;

      const ratio = Math.min(PHOTO_MAX_W / w, PHOTO_MAX_H / h, 1);
      const nw = Math.max(1, Math.round(w * ratio));
      const nh = Math.max(1, Math.round(h * ratio));

      const canvas = document.createElement("canvas");
      canvas.width = nw;
      canvas.height = nh;

      const ctx = canvas.getContext("2d", { alpha:false });
      ctx.drawImage(img, 0, 0, nw, nh);

      let q = PHOTO_QUALITY;
      let out = canvas.toDataURL("image/jpeg", q);
      while(estimateBase64Bytes(out) > PHOTO_MAX_BYTES && q > 0.25){
        q = Math.max(0.25, q - 0.08);
        out = canvas.toDataURL("image/jpeg", q);
      }

      if(estimateBase64Bytes(out) > PHOTO_MAX_BYTES){
        console.warn("Foto ainda grande após compressão:", estimateBase64Bytes(out));
      }
      return out;
    }

    async function getCompressedDataURLFromInput(inputId){
      const f = fileFromInput(inputId);
      if(!f) return "";
      return await compressImageToDataURL(f);
    }

    async function collectExtraPhotosData(prefix){
      const extraInputs = Array.from(document.querySelectorAll(`input[id^='${prefix}fotoExtra_']`));
      const data = [];
      for(const input of extraInputs){
        const file = input?.files?.[0];
        if(!file || !file.type?.startsWith("image/")) continue;
        const url = await compressImageToDataURL(file);
        data.push(url);
      }
      return data;
    }

    function fotosRequiredOk(f){
      return !!(f?.frente && f?.mala && f?.lateralEsq && f?.lateralDir);
    }

    function totalFotosBytes(f){
      let sum = 0;
      sum += estimateBase64Bytes(f?.frente || "");
      sum += estimateBase64Bytes(f?.mala || "");
      sum += estimateBase64Bytes(f?.lateralEsq || "");
      sum += estimateBase64Bytes(f?.lateralDir || "");
      const ex = Array.isArray(f?.extras) ? f.extras : [];
      ex.forEach(x => sum += estimateBase64Bytes(x || ""));
      return sum;
    }

    function docSizeGuardOrThrow(fotos){
      const bytesFotos = totalFotosBytes(fotos);
      const LIMIT = 900 * 1024;
      if(bytesFotos > LIMIT){
        throw new Error("Fotos muito pesadas para salvar no Firestore. Tire as fotos mais próximas / com menos detalhe ou diminua extras.");
      }
    }

    async function salvarEntrada(){

        ? (document.getElementById("entradaLoja")?.value || "")
        : currentUserStoreId();

      const placa = formatPlate(document.getElementById("entradaPlaca")?.value || "");

      const motivo = document.getElementById("entradaMotivo")?.value || "";
      const motivoOutro = (document.getElementById("entradaMotivoOutro")?.value || "").trim();
      const condutor = document.getElementById("entradaCondutor")?.value || "";
      const autorizador = document.getElementById("entradaAutorizador")?.value || "";
      const observacao = (document.getElementById("entradaObs")?.value || "").trim();

      if(!lojaId){ showNotice(notice, "Selecione a loja."); return; }
      if(!placa || !isValidPlate(placa)){ showNotice(notice, "Informe uma placa válida."); return; }
      if(!veiculo){ showNotice(notice, "Informe o veículo."); return; }
      if(!motivo){ showNotice(notice, "Selecione o motivo."); return; }
      if(motivo === "Outro" && !motivoOutro){ showNotice(notice, "Descreva o motivo (Outro)."); return; }
      if(!condutor){ showNotice(notice, "Selecione o condutor."); return; }
      if(!autorizador){ showNotice(notice, "Selecione o autorizador."); return; }

      try{
        const [frente, mala, lateralEsq, lateralDir] = await Promise.all([
          getCompressedDataURLFromInput("entradaFotoFrente"),
          getCompressedDataURLFromInput("entradaFotoMala"),
          getCompressedDataURLFromInput("entradaFotoLatEsq"),
          getCompressedDataURLFromInput("entradaFotoLatDir")
        ]);

        const extras = await collectExtraPhotosData("entrada");
        const fotos = { frente, mala, lateralEsq, lateralDir, extras: extras || [] };

        if(!fotosRequiredOk(fotos)){
          showNotice(notice, "As 4 fotos principais são obrigatórias.");
          return;
        }

        docSizeGuardOrThrow(fotos);

        await addDoc(collection(db, Collections.MOVIMENTOS), {
          tipo: "entrada",

          placa,
          veiculo,
          motivo,
          motivoOutro: motivo === "Outro" ? motivoOutro : "",

          criadoPorUid: state.authUser.uid,

          data: new Date()

        await refreshAfterWrite();
        showNotice(notice, "Entrada registrada com sucesso.", "success");
        renderEntrada();

    function applyConsultaFilter(){
      const body = document.getElementById("consultaBody");
      const empty = document.getElementById("consultaEmpty");
      if(!body || !empty) return;

      const lojaId = userIsGeneralManager()
        ? (document.getElementById("filtroLojaConsulta")?.value || "__ALL__")
        : currentUserStoreId();

      const placa = normalizePlate(document.getElementById("filtroPlacaConsulta")?.value || "");
      const tipo = (document.getElementById("filtroTipoConsulta")?.value || "").toLowerCase();
      const texto = (document.getElementById("filtroTextoConsulta")?.value || "").trim().toLowerCase();

      const di = document.getElementById("filtroDataIni")?.value || "";
      const df = document.getElementById("filtroDataFim")?.value || "";
      const tIni = dateToRangeStart(di);
      const tFim = dateToRangeEnd(df);

      let items = [...state.movimentos];

      if(lojaId && lojaId !== "__ALL__") items = items.filter(i => i.lojaId === lojaId);
      if(placa) items = items.filter(i => normalizePlate(i.placa).includes(placa));
      if(tipo) items = items.filter(i => String(i.tipo||"").toLowerCase() === tipo);

      if(tIni || tFim){
        items = items.filter(i=>{
          const t = dateValueToMillis(i.data);
          if(t==null) return false;
          if(tIni && t<tIni) return false;
          if(tFim && t>tFim) return false;
          return true;
        });
      }

      if(texto){
        items = items.filter(i=>{
          const motivoFinal = i.motivo==="Outro" && i.motivoOutro ? `Outro: ${i.motivoOutro}` : (i.motivo||"");
          const haystack = [i.veiculo, motivoFinal, i.condutor, i.autorizador, i.observacao, i.criadoPorNome, getStoreLabel(i.lojaId)].join(" ").toLowerCase();
          return haystack.includes(texto);
        });
      }

      items.sort((a,b)=> (dateValueToMillis(b.data)||0) - (dateValueToMillis(a.data)||0));

      body.innerHTML = items.map(item=>{
        const fotos = item?.fotos || {};
        const extrasCount = Array.isArray(fotos.extras) ? fotos.extras.length : 0;
        const baseCount = [fotos.frente, fotos.mala, fotos.lateralEsq, fotos.lateralDir].filter(Boolean).length;
        const totalFotos = baseCount + extrasCount;
        const motivoFinal = item.motivo==="Outro" && item.motivoOutro ? `Outro: ${item.motivoOutro}` : (item.motivo||"-");

        const alertaBadge = (item.alerta===true && item.alertaTipo==="saida_fora_padrao" && item.alertaResolvido!==true)
          ? `<span class="badge badge-amber">ALERTA</span>`
          : "";

        return `
          <tr class="row-clickable" data-id="${item.id}">
            <td>${formatDate(item.data)}</td>
            <td>${item.tipo==="entrada" ? `<span class="badge badge-green">Entrada</span>` : `<span class="badge badge-red">Saída</span>`} ${alertaBadge}</td>
            <td>${getStoreLabel(item.lojaId||"-")}</td>
            <td>${item.placa||"-"}</td>
            <td>${item.veiculo||"-"}</td>
            <td>${motivoFinal}</td>
            <td>${item.condutor||"-"}</td>
            <td>${item.autorizador||"-"}</td>
            <td>${item.observacao||"-"}</td>
            <td>${totalFotos ? `${totalFotos} foto(s)` : "-"}</td>
            <td>${item.criadoPorNome||"-"}</td>
          </tr>
        `;
      }).join("");

      empty.textContent = items.length ? "" : "Nenhum registro encontrado.";

      Array.from(body.querySelectorAll("tr[data-id]")).forEach(tr=>{
        tr.addEventListener("click", ()=>{
          const id = tr.getAttribute("data-id");
          const found = state.movimentos.find(m=>m.id===id);
          if(found) openDetailModal(found);
        });
      });
    }

    async function saveEditedRegistro(){
      const item = state.selectedMovimento;
      if(!item || !item.id){
        alert("Registro inválido para edição.");
        return;
      }

      const notice = document.getElementById("editNotice");
      clearNotice(notice);

      const placa = formatPlate(document.getElementById("editPlaca")?.value || "");
      const veiculo = (document.getElementById("editVeiculo")?.value || "").trim();
      const motivo = document.getElementById("editMotivo")?.value || "";
      const motivoOutro = (document.getElementById("editMotivoOutro")?.value || "").trim();
      const condutor = document.getElementById("editCondutor")?.value || "";
      const autorizador = document.getElementById("editAutorizador")?.value || "";
      const observacao = (document.getElementById("editObs")?.value || "").trim();

      if(!placa || !isValidPlate(placa)){ showNotice(notice, "Informe uma placa válida."); return; }
      if(!veiculo){ showNotice(notice, "Informe o veículo."); return; }
      if(!motivo){ showNotice(notice, "Selecione o motivo."); return; }
      if(motivo === "Outro" && !motivoOutro){ showNotice(notice, "Descreva o motivo (Outro)."); return; }
      if(!condutor){ showNotice(notice, "Selecione o condutor."); return; }
      if(!autorizador){ showNotice(notice, "Selecione o autorizador."); return; }

      try{
        const cur = item.fotos || {};
        const [newFrente, newMala, newEsq, newDir] = await Promise.all([
          getCompressedDataURLFromInput("editFotoFrente"),
          getCompressedDataURLFromInput("editFotoMala"),
          getCompressedDataURLFromInput("editFotoLatEsq"),
          getCompressedDataURLFromInput("editFotoLatDir"),
        ]);

        const extrasNew = await collectExtraPhotosData("edit");
        const extrasOld = Array.isArray(cur.extras) ? cur.extras : [];

        const fotos = {
          frente: newFrente || cur.frente || "",
          mala: newMala || cur.mala || "",
          lateralEsq: newEsq || cur.lateralEsq || "",
          lateralDir: newDir || cur.lateralDir || "",
          extras: [...extrasOld, ...(extrasNew || [])]
        };

        if(!fotosRequiredOk(fotos)){
          showNotice(notice, "As 4 fotos principais são obrigatórias (pode manter as antigas).");
          return;
        }

        docSizeGuardOrThrow(fotos);

        await updateDoc(doc(db, Collections.MOVIMENTOS, item.id), {
          placa,
          veiculo,
          motivo,
          motivoOutro: motivo === "Outro" ? motivoOutro : "",
          condutor,
          autorizador,
          observacao,
          fotos,
          atualizadoEm: new Date(),
          atualizadoPorUid: state.authUser.uid,
          atualizadoPorNome: state.userProfile?.nome || state.authUser?.email || ""
        });

        await refreshAfterWrite();

        const refreshed = state.movimentos.find(m=>m.id===item.id);
        if(refreshed) state.selectedMovimento = refreshed;

        showNotice(notice, "Registro atualizado com sucesso.", "success");
        state.editMode = false;
        el.btnSaveRegistro.classList.add("hidden");
        el.btnEditRegistro.classList.remove("hidden");
        renderDetailView(state.selectedMovimento);
      }catch(e){
        console.error(e);
        showNotice(notice, `Não foi possível salvar alterações. (${e?.message || e?.code || "erro"})`);
      }
    }

    async function findByCpf(colName, lojaId, cpfDigits){
      const q = query(
        collection(db, colName),
        where("lojaId","==",lojaId),
        where("cpf","==",cpfDigits),
        limit(1)
      );
      const snap = await getDocs(q);
      if(snap.empty) return null;
      const d = snap.docs[0];
      return { id:d.id, ...d.data() };
    }

    async function lookupCondutorByCpf(){
      const lojaId = document.getElementById("condLoja")?.value || "";
      const cpfDigits = onlyDigits(document.getElementById("condCpf")?.value || "");
      const status = document.getElementById("condCpfStatus");

      status.textContent = "";
      if(!cpfDigits || cpfDigits.length !== 11){ status.textContent = "Digite um CPF completo."; return; }
      if(!isValidCPF(cpfDigits)){ status.textContent = "CPF inválido."; return; }
      if(lojaId === "__ALL__"){ status.textContent = "Lookup desativado em “Todas as lojas”. Selecione uma loja."; return; }

      try{
        const existing = await findByCpf(Collections.CONDUTORES, lojaId, cpfDigits);
        if(existing){
          status.innerHTML = `<span class="badge badge-blue">Encontrado</span> Você pode editar e salvar.`;
          document.getElementById("condNome").value = existing.nome || "";
          document.getElementById("condCargo").value = existing.cargo || "";
          document.getElementById("condAtivo").value = (existing.ativo===false) ? "false" : "true";
        }else{
          status.innerHTML = `<span class="badge badge-green">Novo</span> CPF não encontrado nesta loja.`;
          document.getElementById("condNome").value = "";
          document.getElementById("condCargo").value = "";
          document.getElementById("condAtivo").value = "true";
        }
      }catch(e){
        console.error(e);
        status.textContent = `Erro no lookup: ${e?.code || "erro"}`;
      }
    }

    async function salvarCondutor(){
      const notice = document.getElementById("condNotice");
      clearNotice(notice);

      const lojaSel = document.getElementById("condLoja")?.value || "";
      const cpfDigits = onlyDigits(document.getElementById("condCpf")?.value || "");
      const nome = (document.getElementById("condNome")?.value || "").trim();
      const cargo = (document.getElementById("condCargo")?.value || "").trim();
      const ativo = (document.getElementById("condAtivo")?.value || "true") === "true";

      if(!lojaSel){ showNotice(notice, "Selecione a loja."); return; }
      if(!cpfDigits || cpfDigits.length !== 11 || !isValidCPF(cpfDigits)){ showNotice(notice, "Informe um CPF válido."); return; }
      if(!nome){ showNotice(notice, "Informe o nome."); return; }
      if(!cargo){ showNotice(notice, "Informe o cargo."); return; }

      try{
        const lojasAlvo = (lojaSel==="__ALL__") ? state.lojas.map(l=>l.id) : [lojaSel];

        for(const lojaId of lojasAlvo){
          const id = condutorDocId(lojaId, cpfDigits);
          await setDoc(doc(db, Collections.CONDUTORES, id), {
            lojaId,
            cpf: cpfDigits,
            nome,
            cargo,
            ativo,
            atualizadoEm: new Date(),
            atualizadoPorUid: state.authUser.uid,
            atualizadoPorNome: state.userProfile?.nome || state.authUser?.email || ""
          }, { merge:true });
        }

        await refreshAfterWrite();
        showNotice(notice, "Condutor salvo com sucesso.", "success");
        renderCondutores();
      }catch(e){
        console.error(e);
        showNotice(notice, `Falha ao salvar. (${e?.code || "erro"})`);
      }
    }

            <div class="form-group">
              <label>&nbsp;</label>
              <button class="btn btn-success" id="btnSalvarAutorizador">Salvar autorizador</button>
            </div>
          </div>

          <div id="autNotice" class="notice"></div>

          <div class="section-title">Lista</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Loja</th>
                  <th>Nome</th>
                  <th>CPF</th>
                  <th>Cargo</th>
                  <th>Ativo</th>
                  <th>Ação</th>
                </tr>
              </thead>
              <tbody id="autListBody"></tbody>
            </table>
          </div>
        `
      );

      attachInputMasks();
      document.getElementById("btnSalvarAutorizador").addEventListener("click", salvarAutorizador);
      document.getElementById("autCpf").addEventListener("blur", lookupAutorizadorByCpf);
      document.getElementById("autLoja").addEventListener("change", () => {
        document.getElementById("autCpfStatus").textContent = "";
        document.getElementById("autNome").value = "";
        document.getElementById("autCargo").value = "";
        document.getElementById("autAtivo").value = "true";
      });

      renderAutorizadoresList();
    }

    function renderAutorizadoresList(){
      const body = document.getElementById("autListBody");
      if(!body) return;

      let items = [...state.autorizadores];
      if(!userIsGeneralManager()) items = items.filter(i => i.lojaId === currentUserStoreId());

      items.sort((a,b) => `${a.lojaId||""} ${a.nome||""}`.localeCompare(`${b.lojaId||""} ${b.nome||""}`,"pt-BR"));

      body.innerHTML = items.map(i => `
        <tr>
          <td>${getStoreLabel(i.lojaId||"-")}</td>
          <td>${i.nome||"-"}</td>
          <td>${i.cpf ? formatCPF(i.cpf) : "-"}</td>
          <td>${i.cargo||"-"}</td>
          <td>${i.ativo===false ? "Não" : "Sim"}</td>
          <td>
            <button class="btn btn-light" data-toggle-aut="${i.id}">
              ${i.ativo===false ? "Ativar" : "Inativar"}
            </button>
          </td>
        </tr>
      `).join("");

      Array.from(body.querySelectorAll("[data-toggle-aut]")).forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-toggle-aut");
          const found = state.autorizadores.find(x => x.id === id);
          if(!found) return;
          try{
            await updateDoc(doc(db, Collections.AUTORIZADORES, id), {
              ativo: found.ativo===false ? true : false,
              atualizadoEm: new Date(),
              atualizadoPorUid: state.authUser.uid,
              atualizadoPorNome: state.userProfile?.nome || state.authUser?.email || ""
            });
            await refreshAfterWrite();
            renderAutorizadores();
          }catch(e){
            alert(`Falha ao atualizar: ${e?.code || "erro"}`);
          }
        });
      });
    }

    async function lookupAutorizadorByCpf(){
      const lojaId = document.getElementById("autLoja")?.value || "";
      const cpfDigits = onlyDigits(document.getElementById("autCpf")?.value || "");
      const status = document.getElementById("autCpfStatus");

      status.textContent = "";
      if(!cpfDigits || cpfDigits.length !== 11){ status.textContent = "Digite um CPF completo."; return; }
      if(!isValidCPF(cpfDigits)){ status.textContent = "CPF inválido."; return; }
      if(lojaId === "__ALL__"){ status.textContent = "Lookup desativado em “Todas as lojas”. Selecione uma loja."; return; }

      try{
        const existing = await findByCpf(Collections.AUTORIZADORES, lojaId, cpfDigits);
        if(existing){
          status.innerHTML = `<span class="badge badge-blue">Encontrado</span> Você pode editar e salvar.`;
          document.getElementById("autNome").value = existing.nome || "";
          document.getElementById("autCargo").value = existing.cargo || "";
          document.getElementById("autAtivo").value = (existing.ativo===false) ? "false" : "true";
        }else{
          status.innerHTML = `<span class="badge badge-green">Novo</span> CPF não encontrado nesta loja.`;
          document.getElementById("autNome").value = "";
          document.getElementById("autCargo").value = "";
          document.getElementById("autAtivo").value = "true";
        }
      }catch(e){
        console.error(e);
        status.textContent = `Erro no lookup: ${e?.code || "erro"}`;
      }
    }

    async function salvarAutorizador(){
      const notice = document.getElementById("autNotice");
      clearNotice(notice);

      const lojaSel = document.getElementById("autLoja")?.value || "";
      const cpfDigits = onlyDigits(document.getElementById("autCpf")?.value || "");
      const nome = (document.getElementById("autNome")?.value || "").trim();
      const cargo = (document.getElementById("autCargo")?.value || "").trim();
      const ativo = (document.getElementById("autAtivo")?.value || "true") === "true";

      if(!lojaSel){ showNotice(notice, "Selecione a loja."); return; }
      if(!cpfDigits || cpfDigits.length !== 11 || !isValidCPF(cpfDigits)){ showNotice(notice, "Informe um CPF válido."); return; }
      if(!nome){ showNotice(notice, "Informe o nome."); return; }
      if(!cargo){ showNotice(notice, "Informe o cargo."); return; }

      try{
        const lojasAlvo = (lojaSel==="__ALL__") ? state.lojas.map(l=>l.id) : [lojaSel];

        for(const lojaId of lojasAlvo){
          const id = autorizadorDocId(lojaId, cpfDigits);
          await setDoc(doc(db, Collections.AUTORIZADORES, id), {
            lojaId,
            cpf: cpfDigits,
            nome,
            cargo,
            ativo,
            atualizadoEm: new Date(),
            atualizadoPorUid: state.authUser.uid,
            atualizadoPorNome: state.userProfile?.nome || state.authUser?.email || ""
          }, { merge:true });
        }

        await refreshAfterWrite();
        showNotice(notice, "Autorizador salvo com sucesso.", "success");
        renderAutorizadores();
      }catch(e){
        console.error(e);
        showNotice(notice, `Falha ao salvar. (${e?.code || "erro"})`);
      }
    }

    function renderGestaoLojas(){
      if(!canManageLojas()){
        renderPanel("Acesso restrito","Somente gerente geral.",`<div class="empty">Acesso negado.</div>`);
        return;
      }

      const rows = state.lojas.map(l=>`
        <tr>
          <td>${l.id}</td>
          <td>${l.nome||"-"}</td>
          <td>${l.ativo===false ? "Não" : "Sim"}</td>
        </tr>
      `).join("");

      renderPanel(
        "Gestão de lojas",
        "Crie ou atualize lojas. O ID é o documento (ex.: 0001) e o nome é o visível.",
        `
          <div class="grid">
            <div class="form-group">
              <label for="lojaIdNovo">ID da loja <span class="req">*</span></label>
              <input class="input" id="lojaIdNovo" maxlength="40" placeholder="Ex.: 0001">
            </div>

            <div class="form-group">
              <label for="lojaNomeNovo">Nome da loja <span class="req">*</span></label>
              <input class="input" id="lojaNomeNovo" maxlength="80" placeholder="Ex.: Vigorito - Matriz">
            </div>

            <div class="form-group">
              <label for="lojaAtivaNovo">Ativa</label>
              <select class="select" id="lojaAtivaNovo">
                <option value="true">Sim</option>
                <option value="false">Não</option>
              </select>
            </div>

            <div class="form-group">
              <label>&nbsp;</label>
              <button class="btn btn-success" id="btnSalvarLoja">Salvar loja</button>
            </div>
          </div>

          <div id="lojasNotice" class="notice"></div>

          <div class="section-title">Lojas cadastradas</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nome</th>
                  <th>Ativa</th>
                </tr>
              </thead>
              <tbody>
                ${rows || `<tr><td colspan="3">Nenhuma loja cadastrada.</td></tr>`}
              </tbody>
            </table>
          </div>
        `
      );

      document.getElementById("btnSalvarLoja").addEventListener("click", salvarLojaAdmin);
    }

    async function salvarLojaAdmin(){
      const notice = document.getElementById("lojasNotice");
      clearNotice(notice);

      const lojaId = (document.getElementById("lojaIdNovo")?.value || "").trim();
      const nome = (document.getElementById("lojaNomeNovo")?.value || "").trim();
      const ativo = (document.getElementById("lojaAtivaNovo")?.value || "true") === "true";

      if(!lojaId){ showNotice(notice, "Informe o ID da loja."); return; }
      if(!/^[a-zA-Z0-9_-]+$/.test(lojaId)){ showNotice(notice, "ID inválido. Use apenas letras, números, _ ou -."); return; }
      if(!nome){ showNotice(notice, "Informe o nome da loja."); return; }

      try{
        await setDoc(doc(db, Collections.LOJAS, lojaId), {
          nome,
          ativo,
          atualizadoEm: new Date(),
          atualizadoPorUid: state.authUser?.uid || "",
          atualizadoPorNome: state.userProfile?.nome || state.authUser?.email || ""
        }, { merge:true });

        await refreshAfterWrite();
        showNotice(notice, "Loja salva com sucesso.", "success");
        renderGestaoLojas();
      }catch(e){
        console.error(e);
        showNotice(notice, `Não foi possível salvar a loja. (${e?.code || "erro"})`);
      }
    }

    // ========= refresh / auth =========
    async function refreshAfterWrite(){
      await loadLojas();
      await loadOperationalCollections();
      renderShellInfo();
      renderDashboard();
    }

    async function login(){
      clearNotice(el.loginNotice);
      const email = el.loginEmail.value.trim();
      const senha = el.loginSenha.value;

      if(!email || !senha){
        showNotice(el.loginNotice, "Preencha e-mail e senha.");
        return;
      }

      el.btnLogin.disabled = true;
      try{
        await signInWithEmailAndPassword(auth, email, senha);
      }catch(error){
        showNotice(el.loginNotice, `Não foi possível entrar. (${error?.code || "erro"})`);
      }finally{
        el.btnLogin.disabled = false;
      }
    }

    async function logout(){
      try{ await signOut(auth); }catch(e){}
    }

    function showFatalAppError(err){
      const code = err?.code || "erro";
      const msg = err?.message || String(err || "");
      renderPanel(
        "Erro ao carregar",
        "O sistema não conseguiu carregar suas informações.",
        `
          <div class="notice show error">
            <strong>Falha:</strong> ${code}<br/>
            <div style="margin-top:6px;">${msg}</div>
          </div>
          <div class="actions">
            <button class="btn btn-light" id="btnRetryLoad">Tentar novamente</button>
          </div>
        `
      );

      setTimeout(() => {
        const btn = document.getElementById("btnRetryLoad");
        if(btn){
          btn.addEventListener("click", async () => {
            try{
              await refreshAfterWrite();
              renderDashboardHome();
            }catch(e){
              showFatalAppError(e);
            }
          });
        }
      }, 0);
    }

    async function initializeAuthenticatedUser(user){
      state.authUser = user;

      el.loginView.style.display = "none";
      el.topbar.style.display = "flex";
      el.footerbar.style.display = "block";
      el.appView.style.display = "block";

      try{
        await loadUserProfile(user.uid);
        await loadLojas();
        await loadOperationalCollections();

        renderShellInfo();
        renderDashboard();
        buildMenu();
        renderDashboardHome();
      }catch(err){
        showFatalAppError(err);
      }
    }

    function resetAppState(){
      state.authUser = null;
      state.userProfile = null;
      state.lojas = [];
      state.lojasMap = {};
      state.movimentos = [];
      state.condutores = [];
      state.autorizadores = [];
      state.selectedMovimento = null;
      state.editMode = false;

      el.topbar.style.display = "none";
      el.footerbar.style.display = "none";
      el.appView.style.display = "none";
      el.loginView.style.display = "flex";

      el.dashboardCards.innerHTML = "";
      el.menuBar.innerHTML = "";
      el.mainPanel.innerHTML = `
        <div class="card-header">
          <div>
            <h3>Bem-vindo</h3>
            <p>Selecione uma função no menu acima.</p>
          </div>
        </div>
      `;
      closeDetailModal();
    }

    // ========= Eventos =========
    el.btnLogin.addEventListener("click", login);
    el.btnLogout.addEventListener("click", logout);

    el.loginSenha.addEventListener("keydown", (e) => {
      if(e.key === "Enter") login();
    });

    el.btnCloseModal.addEventListener("click", closeDetailModal);
    el.btnCloseModal2.addEventListener("click", closeDetailModal);
    el.detailModal.addEventListener("click", (e) => {
      if(e.target === el.detailModal) closeDetailModal();
    });

    el.btnExportRegistro.addEventListener("click", exportSelectedRegistro);

    el.btnEditRegistro.addEventListener("click", () => {
      const item = state.selectedMovimento;
      if(!item) return;
      state.editMode = true;
      el.btnEditRegistro.classList.add("hidden");
      el.btnSaveRegistro.classList.remove("hidden");
      renderDetailEdit(item);
    });

    el.btnSaveRegistro.addEventListener("click", saveEditedRegistro);

    // ✅ NOVO: resolver alerta
    if(el.btnResolveAlert){
      el.btnResolveAlert.addEventListener("click", resolveSelectedAlert);
    }

    onAuthStateChanged(auth, async (user) => {
      if(!user){
        resetAppState();
        return;
      }
      await initializeAuthenticatedUser(user);
    });

    console.log("Sistema carregado.");
  </script>
</body>
</html>
